evices, particularly those designed for high-speed operation, such as Modulators and Photodetectors. Low capacitance is essential because the device speed is often limited by the electrical RC_Time_Constant (τRC), where capacitance (Cj or Cpd) is a primary factor. In specific contexts: • Photodetectors (Detectors): PIN Detectors typically exhibit low capacitance, which contributes to high speed. High-speed photodetectors often require a small cross-section to reduce device capacitance and improve speed. For example, an ultra-low photodetector capacitance of 2.4 fF has been achieved in a photoconductive device. A representative example calculation shows that a detector with a junction capacitance of 40 fF has an RC time constant of 2 ps, resulting in an RC-limited bandwidth of 20 GHz. Generally, a smaller detector width will lower the capacitance and increase the bandwidth. • Modulators (pn-Junctions): In pn-Junction_Phase_Shifters, the capacitance (Cj) is voltage-dependent, decreasing as the applied DC voltage increases due to the expansion of the depletion region. For silicon optical modulators, the intrinsic RC constant is typically not the limiting factor and can easily exceed tens of GHz. However, the RC time constant does become a limitation when a long junction is used (resulting in a large capacitance) in conjunction with a large source impedance. • System Integration: Achieving low capacitance (e.g., ∼25 fF in a WDM ring modulator) is a key design target for high-data-rate applications like Wavelength Division Multiplexed (WDM) systems and optical interconnects, contributing to ultra-high electro-optic bandwidth and low power consumption. • Packaging: Flip-chip bonding is highly attractive for high-frequency applications because it significantly reduces parasitic capacitance compared to other packaging techniques like wire bonding (e.g., adjacent balls introducing only 50 fF of capacitance, compared to the bump pad capacitance of 177 fF).", "reasoning": "The description for `Low Capacitance` explicitly names `Photodetectors` as a component where this property is highly desired for high-speed operation. It directly states that low capacitance contributes to high speed in detectors.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 0, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:198", "head": "Thermo-optic Switch", "head_type": "Component", "head_description": "A thermo-optic switch is a component used in active photonic circuits to provide active control over the optical signal path. It is often co-integrated on a photonic integrated circuit with other components, such as monolithically-integrated photodetectors and hybrid-integrated laser diodes.", "relation": "HAS_PROPERTY", "tail": "Thermal Isolation", "tail_type": "Property", "tail_description": "Thermal_Isolation is a fundamental property representing a design strategy used to minimize unwanted heat transfer, particularly in active photonic devices that rely on the Thermo_Optic_Effect, such as Thermal_Phase_Shifters or resonant filters that require precise wavelength tuning. It is a critical factor in achieving high Tuning_Efficiency. Improving thermal isolation involves minimizing thermal_conduction pathways. Techniques to enhance thermal isolation and thus reduce power consumption (measured in mW/FSR) include selectively undercutting the back-side of the substrate beneath the heater, etching vertical trenches next to the thermal phase shifter, or using under-etching to improve the thermal isolation of the waveguide. In the context of Laser modelling and integration, achieving adequate thermal isolation is also a key challenge; for instance, the Buried_Oxide (BOX) layer in silicon-on-insulator (SOI) wafers, which is a key structural component for optical confinement, also acts as a thermal isolator. In external cavity lasers where the gain chip is flip-chip bonded onto the silicon photonic chip, the oxide is sometimes removed and metal contacts are deposited on the silicon to improve the heat sinking capability, which is the opposite of thermal isolation.", "reasoning": "The candidate entity description for the property 'Thermal Isolation' links it to 'active photonic devices that rely on the Thermo_Optic_Effect, such as Thermal_Phase_Shifters'. A Thermo-optic Switch is such a device. Therefore, a well-designed Thermo-optic Switch would be designed to have the property of good Thermal Isolation to ensure efficiency and reduce crosstalk.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 1, "evidence_quotes": ["The optical switch was a Mach-Zehnder interferometer with a 328-µm long TO phase shifter in one arm.", "The phase shifter used a 3-pass folded waveguide structure, a titanium nitride heater, and thermal isolation trenches [1]."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1684", "head": "photodetectors", "head_type": "Component", "head_description": "Integrated photodetectors are components used in programmable photonic circuits to handle the conversion of modulated optical signals back into radiofrequency waves. In conjunction with high-speed modulators, they provide the input and output ports for processing microwave signals on the optical chip. They can be implemented as waveguide-coupled silicon (Si) photodetectors within visible-light silicon photonics platforms, where they are often co-integrated with components such as laser diodes, optical switches, and MEMS devices on silicon nitride (SiN) waveguides to form active photonic circuits.", "relation": "RELATED_TO", "tail": "integration of the photodetector with a tunable microring filter", "tail_type": "Architecture", "tail_description": "This architecture describes a photonic integrated circuit (PIC) that monolithically combines a silicon nitride-on-silicon photodetector with a tunable SiN racetrack microring filter on a single chip. The system is designed as a proof-of-concept for on-chip power monitoring. A titanium nitride (TiN) heater is integrated with the microring to provide thermal tuning capability. This represents the first demonstrated visible spectrum photonic circuit with a monolithically integrated photodetector.", "reasoning": "The candidate entity is an Architecture that 'monolithically combines a silicon nitride-on-silicon photodetector with a tunable SiN racetrack microring filter'. This architecture explicitly uses a photodetector component. The new entity 'photodetectors' is that component. While the standard edge would be Architecture USES_COMPONENT Component, a RELATED_TO relationship is appropriate to capture this connection.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 2, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1708", "head": "alignment structures", "head_type": "Component", "head_description": "Alignment structures are lithographically-defined features fabricated on both the Si photonic chips and the laser diodes (LDs). They are used in conjunction with mechanical stoppers to enable the passive-alignment flip-chip bonding process. This method facilitates the achievement of high on-chip optical powers, such as 9.6 mW, without requiring active alignment.", "relation": "RELATED_TO", "tail": "hybrid laser", "tail_type": "Architecture", "tail_description": "A compact laser architecture created by combining different material platforms. One demonstrated version consists of an Indium Phosphide (InP) gain block coupled to a high-Q Si3N4 microring resonator (MRR), which functions as an external laser mirror. This configuration achieved an integral linewidth of 13 kHz. A variation of this design incorporates a long photon lifetime Si3N4 MRR as a tuning section, resulting in a tunable wavelength output and a fundamental linewidth of less than 300 Hz.", "reasoning": "The 'alignment structures' are described as components used for the 'passive-alignment flip-chip bonding process' of 'laser diodes (LDs)' onto 'Si photonic chips'. A 'hybrid laser' is an architecture created by combining different material platforms, such as an InP gain block (a laser diode) with a Si3N4 circuit. Therefore, alignment structures are a key enabling component used in the fabrication of hybrid laser architectures.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 3, "evidence_quotes": ["With lithographically-defined alignment structures and mechanical stoppers on both the Si photonic chips and LDs, we achieve continuous-wave on-chip optical powers up to 9.6 mW - an order of magnitude beyond previous reports [10,11] and comparable to actively-aligned LD demonstrations [7,8]."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:999", "head": "photodetectors", "head_type": "Component", "head_description": "Integrated photodetectors are components used in programmable photonic circuits to handle the conversion of modulated optical signals back into radiofrequency waves. In conjunction with high-speed modulators, they provide the input and output ports for processing microwave signals on the optical chip. They can be implemented as waveguide-coupled silicon (Si) photodetectors within visible-light silicon photonics platforms, where they are often co-integrated with components such as laser diodes, optical switches, and MEMS devices on silicon nitride (SiN) waveguides to form active photonic circuits.", "relation": "BASED_ON_PRINCIPLE", "tail": "Carrier Generation", "tail_type": "Physical_Principle", "tail_description": "Carrier_Generation is a fundamental physical principle describing the process where photons are absorbed within a semiconductor material, leading to the creation of electron–hole pairs, which is necessary for converting an optical signal into an electrical signal in photodetectors. This principle is crucial for assessing photodetector performance (e.g., Responsivity and Quantum_Efficiency). Devices based on this principle are essential not only for receiving optical signals but also serve as on-chip monitors for PIC operation. The process is quantified in simulations as the optical generation rate, which is calculated by optical solvers and exported to electronic device solvers. Furthermore, carrier generation can occur via secondary effects like Impact_Ionization in avalanche photodetectors to achieve gain.", "reasoning": "The description of `Carrier Generation` explicitly defines it as the fundamental physical principle 'necessary for converting an optical signal into an electrical signal in photodetectors.' This directly links the principle to the component's function.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 4, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1743", "head": "folded waveguide", "head_type": "Component", "head_description": "A folded waveguide is a component used in the design of the thermo-optic phase shifter within the Mach-Zehnder interferometer optical switch. Specifically, a 3-pass folded waveguide structure is employed to increase the interaction length within a compact footprint. This waveguide is heated by a titanium nitride heater to induce a phase shift.", "relation": "PERFORMS_FUNCTION", "tail": "Optical Switch", "tail_type": "Design_Function", "tail_description": "The Optical_Switch is listed as a fundamental design function in photonic integrated circuits. This functionality is commonly implemented using components that rely on active phase shifting, most notably the Mach–Zehnder Interferometer (MZI) structure. When incorporated into an MZI, the device can function as a Thermo-optic switch by applying a temperature difference (ΔT) between the two arms. The switch operates by exploiting the Thermo_Optic_Effect in silicon, where a temperature increase in one arm causes a change in the propagation constant (β2). This thermal change results in the MZI output exhibiting a sinusoidally varying function of wavelength and temperature. Alternative designs often utilize electrical components like PIN phase shifters inside MZIs or ring structures to achieve high-speed switching. Given the thermal sensitivity of silicon photonic devices, minimizing the power consumption required for trimming large arrays of Mach–Zehnder switches is a critical design challenge.", "reasoning": "The new entity description explicitly states that the 'folded waveguide' is a component used within a 'Mach-Zehnder interferometer optical switch'. As a key component that enables the phase shift required for switching, it directly contributes to performing the 'Optical Switch' design function.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 5, "evidence_quotes": ["The optical switch was a Mach-Zehnder interferometer with a 328-µm long TO phase shifter in one arm.", "The phase shifter used a 3-pass folded waveguide structure, a titanium nitride heater, and thermal isolation trenches [1]."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1677", "head": "passive-alignment flip-chip bonding", "head_type": "Architecture", "head_description": "Passive-alignment flip-chip bonding is a hybrid integration technique used to mount blue InGaN laser diodes onto a foundry-fabricated visible-light silicon photonics platform. This method utilizes lithographically-defined alignment structures and mechanical stoppers on both the silicon photonic chips and the laser diodes to achieve alignment without active power-on optimization. This integration scheme enables the realization of active photonic integrated circuits (PICs) that include the bonded laser, a power monitor, and an optical switch, achieving on-chip optical powers up to 9.6 mW.", "relation": "HAS_PROPERTY", "tail": "Excess Loss", "tail_type": "Property", "tail_description": "Excess Loss is a fundamental property defining undesirable optical power loss in a device that is beyond its fundamental, intended functionality. Common sources include material absorption, dopant effects, and alignment errors. In the context of coupling between two components, such as a laser diode and a waveguide, excess loss is the portion of the total coupling loss attributed specifically to physical misalignment, as distinct from the fundamental loss due to modal mismatch which would occur even with perfect alignment. For example, in an Edge_Coupler, a lateral offset can introduce significant excess loss, while in active devices like PIN_Junctions, the presence of dopants introduces excess optical loss.", "reasoning": "The text attributes '≈ 2.1 dB of excess loss due to misalignment after bonding.' The bonding process is the 'passive-alignment flip-chip bonding' architecture, which therefore exhibits this property.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 6, "evidence_quotes": ["Optical mode simulations indicate an optimally-aligned coupling loss (due to modal mismatch) of 2.7 dB, and hence, ≈2.1 dB of excess loss due to misalignment after bonding."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1726", "head": "modal mismatch", "head_type": "Physical_Principle", "head_description": "Modal mismatch is a source of optical loss that occurs when the spatial profile of the optical mode from the laser diode does not perfectly match the mode profile of the receiving SiN waveguide. According to optical mode simulations, modal mismatch accounts for 2.7 dB of coupling loss even under optimal alignment conditions.", "relation": "RELATED_TO", "tail": "bilayer edge coupler", "tail_type": "Architecture", "tail_description": "A bilayer edge coupler is a foundry-compatible architecture designed for efficient light coupling between an optical fiber and a high-confinement waveguide on a chip. It is composed of two silicon nitride (SiN) layers: a thin top layer (SiN2, ~75 nm) and a thicker lower routing layer (SiN1, 150 nm). Light from a fiber is first launched into the thin SiN2 layer, which supports a larger mode field diameter, and is then efficiently transferred down to the main SiN1 routing layer via an interlayer adiabatic tapered transition. This architecture demonstrated a fiber-to-chip coupling loss of >4.0 dB per facet over a broad wavelength range of 445-640 nm.", "reasoning": "The description of 'bilayer edge coupler' states it is designed for efficient light coupling, which inherently involves minimizing losses from sources like modal mismatch. The description mentions supporting a 'larger mode field diameter', which is a direct strategy to reduce modal mismatch. Therefore, the physical principle of modal mismatch is fundamentally related to the design and purpose of the bilayer edge coupler.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 7, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1690", "head": "Thermo-optic Switch", "head_type": "Component", "head_description": "A thermo-optic switch is a component used in active photonic circuits to provide active control over the optical signal path. It is often co-integrated on a photonic integrated circuit with other components, such as monolithically-integrated photodetectors and hybrid-integrated laser diodes.", "relation": "RELATED_TO", "tail": "Thermal crosstalk", "tail_type": "Physical_Principle", "tail_description": "An undesirable effect in devices with multiple thermo-optic elements, where heat from an active element affects its neighbors. In the prototype OPA, thermal crosstalk between the thermo-optic phase shifters, which had a 30-µm pitch, may have contributed to the device's total power dissipation and sidelobe level (SLL).", "reasoning": "The candidate entity description for 'Thermal crosstalk' explicitly states it is an 'undesirable effect in devices with multiple thermo-optic elements'. A 'Thermo-optic Switch' is a thermo-optic element, and thus it is susceptible to this effect, especially when used in arrays. This makes the two entities directly related as one is a phenomenon that affects the other.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 8, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1676", "head": "TO phase shifter", "head_type": "Component", "head_description": "Subcomponent of architecture 'Mach-Zehnder interferometer'", "relation": "RELATED_TO", "tail": "folded waveguide", "tail_type": "Component", "tail_description": "A folded waveguide is a component used in the design of the thermo-optic phase shifter within the Mach-Zehnder interferometer optical switch. Specifically, a 3-pass folded waveguide structure is employed to increase the interaction length within a compact footprint. This waveguide is heated by a titanium nitride heater to induce a phase shift.", "reasoning": "The text states 'The phase shifter used a 3-pass folded waveguide structure'. This describes a compositional relationship between two components, for which RELATED_TO is the best fit in the current schema.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 9, "evidence_quotes": ["The phase shifter used a 3-pass folded waveguide structure, a titanium nitride heater, and thermal isolation trenches [1]."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1747", "head": "folded waveguide", "head_type": "Component", "head_description": "A folded waveguide is a component used in the design of the thermo-optic phase shifter within the Mach-Zehnder interferometer optical switch. Specifically, a 3-pass folded waveguide structure is employed to increase the interaction length within a compact footprint. This waveguide is heated by a titanium nitride heater to induce a phase shift.", "relation": "BASED_ON_PRINCIPLE", "tail": "Thermo Optic Effect", "tail_type": "Physical_Principle", "tail_description": "The Thermo_Optic_Effect is a fundamental physical principle describing the change in the refractive index of silicon (Δn) due to variations in temperature (T), primarily resulting from the temperature-induced shrinkage of the bandgap [LIST OF PHYSICAL_PRINCIPLES; 50]. Silicon photonic circuits are highly temperature sensitive because of the large thermo-optic coefficient, making this effect crucial for Active Tuning in integrated optics. The effect is exploited to implement Thermal Phase Shifters that provide a pure phase shift and to construct Thermo-optic Switches. This active control is necessary to compensate for fabrication non-uniformity and maintain wavelength matching. Performance is quantified by Tuning Efficiency (e.g., mW/FSR), and while the thermal phase shifters are slow, characterized by a Thermal_Time_Constant, they contrast with the gigahertz speeds achievable using the Plasma Dispersion Effect. Resonant devices exhibit high Thermal Sensitivity, often characterized by wavelength shifts around 84 pm/∘C for strip waveguide gratings.", "reasoning": "The new entity description states that the folded waveguide is heated to induce a phase shift. This process is a direct application of the 'Thermo Optic Effect', which is the physical principle describing the change in refractive index with temperature. Therefore, the component's function is based on this principle.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 10, "evidence_quotes": ["The optical switch was a Mach-Zehnder interferometer with a 328-µm long TO phase shifter in one arm.", "The phase shifter used a 3-pass folded waveguide structure, a titanium nitride heater, and thermal isolation trenches [1]."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1754", "head": "2-D lattice mesh network", "head_type": "Architecture", "head_description": "A complex, programmable photonic circuit architecture used for applications like generalizable RF filtering. This network consists of interconnected Mach-Zehnder (MZ) couplers arranged in a 2-D lattice. Each MZ coupler is configured using thermal phase tuning elements, which allow it to function as either a 2x2 coupler or an optical switch, enabling dynamically configurable filter functions on a single chip.", "relation": "HAS_PROPERTY", "tail": "Pπ", "tail_type": "Property", "tail_description": "Pπ is a key performance metric for a thermo-optic switch, representing the electrical power required to induce a π (180-degree) phase shift in one arm of the Mach-Zehnder interferometer. For the demonstrated optical switch, the two outputs exhibited Pπ values of 12.8 mW and 12.0 mW.", "reasoning": "The new entity Pπ is a key performance metric for a thermo-optic switch, which is based on a Mach-Zehnder interferometer (MZI). The candidate entity '2-D lattice mesh network' is an architecture described as consisting of 'interconnected Mach-Zehnder (MZ) couplers' that use 'thermal phase tuning elements'. Since the architecture is built from components for which Pπ is a critical property, the architecture itself possesses this property as a key performance indicator.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 11, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1709", "head": "alignment structures", "head_type": "Component", "head_description": "Alignment structures are lithographically-defined features fabricated on both the Si photonic chips and the laser diodes (LDs). They are used in conjunction with mechanical stoppers to enable the passive-alignment flip-chip bonding process. This method facilitates the achievement of high on-chip optical powers, such as 9.6 mW, without requiring active alignment.", "relation": "HAS_PROPERTY", "tail": "Alignment Sensitivity", "tail_type": "Property", "tail_description": "Alignment_Sensitivity is a fundamental property [LIST OF PROPERTIES] that quantifies the tolerance of an optical coupler (e.g., Grating_Coupler or Edge_Coupler) to physical misalignment between the chip waveguide interface and the external coupling medium, typically an optical fiber. This parameter is measured as the range of misalignment (in micrometers) that introduces a specific amount of excess Insertion_Loss (often 1 dB) [222; 195]. • Grating Couplers: Alignment sensitivity determines how precisely the optical fiber must be positioned relative to the grating to maximize coupling efficiency. For a specific grating coupler design, the 1 dB alignment sensitivity was simulated to be ±2.3 μm in the lateral direction (related to the optimal fiber position sweep) [195; 197]. • Edge Couplers (Nano-tapers): Edge couplers, particularly nano-tapers, are designed for precision alignment and typically exhibit higher sensitivity compared to grating couplers. Mode overlap calculations for a nano-taper showed that a misalignment of 0.6 μm introduced 1 dB of excess loss [222; 488]. The high alignment difficulty due to this sensitivity is noted as a challenge for edge coupling. • Context: Alignment is a crucial consideration during optical testing and packaging, and high sensitivity increases the complexity and cost of these processes, which is why techniques like flip-chip bonding and the use of fiber arrays are employed to improve stability and alignment [177; 488].", "reasoning": "The 'alignment structures' are components specifically designed to 'enable the passive-alignment flip-chip bonding process'. The purpose of such structures is to control and minimize the effects of misalignment. 'Alignment Sensitivity' is the property that quantifies the tolerance to physical misalignment. Therefore, the component 'alignment structures' inherently has properties related to alignment sensitivity.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 12, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1727", "head": "modal mismatch", "head_type": "Physical_Principle", "head_description": "Modal mismatch is a source of optical loss that occurs when the spatial profile of the optical mode from the laser diode does not perfectly match the mode profile of the receiving SiN waveguide. According to optical mode simulations, modal mismatch accounts for 2.7 dB of coupling loss even under optimal alignment conditions.", "relation": "RELATED_TO", "tail": "planar waveguide", "tail_type": "Component", "tail_description": "A fundamental component of the silicon nitride (Si3N4) photonic platform, enabling the creation of integrated devices and system-on-chip solutions. These waveguides are characterized by their low propagation loss (<1 dB/m), a wide transparency window (400–2350 nm), and the ability to handle high optical power. They can be engineered to perform various linear and nonlinear optical functions and serve as the basis for passive and active building blocks.", "reasoning": "The new entity 'modal mismatch' is a physical principle describing optical loss when coupling light into a 'SiN waveguide'. The candidate entity 'planar waveguide' is a component made of 'silicon nitride (Si3N4)'. Therefore, the physical principle of modal mismatch directly affects the performance of the planar waveguide component. A new edge type 'AFFECTS' is proposed to capture this relationship where a physical principle has an impact on a component's performance.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 13, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1757", "head": "implantable silicon-based probe", "head_type": "Architecture", "head_description": "An implantable, silicon-based device designed to switch and route multiple optical beams for stimulating specific sets of neurons, while simultaneously recording the resulting neural activity. The probe incorporates a nanoscale switching network composed of reconfigurable silicon nitride waveguide structures and co-fabricated electrical recording sites. The technology is scalable and allows for advanced functions like beam focusing, steering, and structured illumination. An eight-beam version was demonstrated to stimulate small groups of neurons in mice with sub-millisecond precision.", "relation": "HAS_PROPERTY", "tail": "Pπ", "tail_type": "Property", "tail_description": "Pπ is a key performance metric for a thermo-optic switch, representing the electrical power required to induce a π (180-degree) phase shift in one arm of the Mach-Zehnder interferometer. For the demonstrated optical switch, the two outputs exhibited Pπ values of 12.8 mW and 12.0 mW.", "reasoning": "The new entity Pπ is a performance metric for a thermo-optic switch. The candidate entity 'implantable silicon-based probe' is an architecture that 'incorporates a nanoscale switching network'. In silicon photonics, such switching networks are commonly implemented using thermo-optic Mach-Zehnder interferometers. Therefore, Pπ is a relevant property for this architecture.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 14, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1733", "head": "power monitor", "head_type": "Architecture", "head_description": "The power monitor is an on-chip circuit designed to measure optical power in a waveguide. It is a component of the demonstrated active Photonic Integrated Circuit (PIC). The monitor is composed of an evanescent directional coupler that taps a fraction of the light and a waveguide-coupled PIN Si photodetector that converts the tapped light into an electrical signal.", "relation": "RELATED_TO", "tail": "optical power", "tail_type": "Property", "tail_description": "Optical power (P_no) is the power of the input light used for device characterization. During linear mode testing, an optical power of 2.13 µW (for TE polarization) and 2.33 µW (for TM polarization) at a wavelength of 488 nm was used, resulting in corresponding photocurrents.", "reasoning": "The description of the 'power monitor' architecture explicitly states its function is 'to measure optical power in a waveguide'. The candidate entity is the property 'optical power'. The architecture is designed to measure this specific property. A new edge type 'MEASURES_PROPERTY' is proposed to capture this direct relationship, as it is distinct from existing types like 'HAS_PROPERTY'.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 15, "evidence_quotes": ["The power monitor consisted of an evanescent directional coupler power tap, which directed tapped light to a 200-µm long, waveguide-coupled, PIN, Si photodetector [6]."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1722", "head": "P and N contacts", "head_type": "Component", "head_description": "P and N contacts are the electrical terminals on the InGaN laser diodes. The lasers are designed with top-side P and N contacts, which enables electrical connectivity to the Si photonic chips. This connection is physically made via solder bumps and UBM wires/pads.", "relation": "RELATED_TO", "tail": "hybrid laser", "tail_type": "Architecture", "tail_description": "A compact laser architecture created by combining different material platforms. One demonstrated version consists of an Indium Phosphide (InP) gain block coupled to a high-Q Si3N4 microring resonator (MRR), which functions as an external laser mirror. This configuration achieved an integral linewidth of 13 kHz. A variation of this design incorporates a long photon lifetime Si3N4 MRR as a tuning section, resulting in a tunable wavelength output and a fundamental linewidth of less than 300 Hz.", "reasoning": "The new entity 'P and N contacts' are described as enabling 'electrical connectivity' for 'InGaN laser diodes' to 'Si photonic chips'. This process of combining a III-V gain material (InGaN) with a silicon photonics platform is the definition of a hybrid laser architecture. Therefore, the P and N contacts are a key component enabling the creation of a hybrid laser.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 16, "evidence_quotes": ["The lasers featured top-side P and N contacts - enabling electrical connectivity to the Si photonic chips via the solder bumps and UBM wires/pads."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1683", "head": "laser diode", "head_type": "Component", "head_description": "Subcomponent of architecture 'active photonic circuit'", "relation": "RELATED_TO", "tail": "wavelength", "tail_type": "Property", "tail_description": "Wavelength is a fundamental property of the light source used in the visible-light Si photonics platform. The work demonstrates the integration of indium gallium nitride (InGaN) lasers with a nominal wavelength of 450 nm. Under a 50 mA drive current, the measured peak emission wavelength of the integrated laser was 451.4 nm.", "reasoning": "Novel type 'OPERATES_AT_WAVELENGTH': The text specifies '450-nm wavelength indium gallium nitride (InGaN) lasers' and a 'peak wavelength was 451.4 nm'. This is a fundamental operating parameter justifying a more specific relationship than HAS_PROPERTY.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 17, "evidence_quotes": ["In this work, we demonstrate passive-alignment flip-chip bonding of 450-nm wavelength indium gallium nitride (InGaN) lasers in a foundry-fabricated visible-light Si photonics platform.", "With 50 mA of drive current, the peak wavelength was 451.4 nm and the linewidth was <0.05 nm (limited by the OSA resolution)."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1682", "head": "laser diode", "head_type": "Component", "head_description": "Subcomponent of architecture 'active photonic circuit'", "relation": "RELATED_TO", "tail": "passive-alignment flip-chip bonding", "tail_type": "Architecture", "tail_description": "Passive-alignment flip-chip bonding is a hybrid integration technique used to mount blue InGaN laser diodes onto a foundry-fabricated visible-light silicon photonics platform. This method utilizes lithographically-defined alignment structures and mechanical stoppers on both the silicon photonic chips and the laser diodes to achieve alignment without active power-on optimization. This integration scheme enables the realization of active photonic integrated circuits (PICs) that include the bonded laser, a power monitor, and an optical switch, achieving on-chip optical powers up to 9.6 mW.", "reasoning": "Novel type 'INTEGRATED_USING': The text describes the 'hybrid integration of... laser diodes... using passive-alignment flip-chip bonding'. This describes the manufacturing architecture used for a component, which is a specific relationship not covered by existing types.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 18, "evidence_quotes": ["We report hybrid integration of blue InGaN laser diodes in a visible-light silicon photonics platform using passive-alignment flip-chip bonding."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1681", "head": "Excess Loss", "head_type": "Property", "head_description": "Excess Loss is a fundamental property defining undesirable optical power loss in a device that is beyond its fundamental, intended functionality. Common sources include material absorption, dopant effects, and alignment errors. In the context of coupling between two components, such as a laser diode and a waveguide, excess loss is the portion of the total coupling loss attributed specifically to physical misalignment, as distinct from the fundamental loss due to modal mismatch which would occur even with perfect alignment. For example, in an Edge_Coupler, a lateral offset can introduce significant excess loss, while in active devices like PIN_Junctions, the presence of dopants introduces excess optical loss.", "relation": "RELATED_TO", "tail": "modal mismatch", "tail_type": "Physical_Principle", "tail_description": "Modal mismatch is a source of optical loss that occurs when the spatial profile of the optical mode from the laser diode does not perfectly match the mode profile of the receiving SiN waveguide. According to optical mode simulations, modal mismatch accounts for 2.7 dB of coupling loss even under optimal alignment conditions.", "reasoning": "The text explains that coupling loss is 'due to modal mismatch' and that misalignment contributes to 'excess loss'. This establishes a causal link between the physical principle and the resulting property.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 19, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1721", "head": "alignment marks", "head_type": "Component", "head_description": "Alignment marks are features fabricated on the edge-emitting InGaN flip-chip laser diodes. They are formed by trench etching and are designed to match corresponding marks on the Si photonic chips. These marks are critical for achieving passive alignment during the flip-chip bonding process.", "relation": "RELATED_TO", "tail": "Alignment Sensitivity", "tail_type": "Property", "tail_description": "Alignment_Sensitivity is a fundamental property [LIST OF PROPERTIES] that quantifies the tolerance of an optical coupler (e.g., Grating_Coupler or Edge_Coupler) to physical misalignment between the chip waveguide interface and the external coupling medium, typically an optical fiber. This parameter is measured as the range of misalignment (in micrometers) that introduces a specific amount of excess Insertion_Loss (often 1 dB) [222; 195]. • Grating Couplers: Alignment sensitivity determines how precisely the optical fiber must be positioned relative to the grating to maximize coupling efficiency. For a specific grating coupler design, the 1 dB alignment sensitivity was simulated to be ±2.3 μm in the lateral direction (related to the optimal fiber position sweep) [195; 197]. • Edge Couplers (Nano-tapers): Edge couplers, particularly nano-tapers, are designed for precision alignment and typically exhibit higher sensitivity compared to grating couplers. Mode overlap calculations for a nano-taper showed that a misalignment of 0.6 μm introduced 1 dB of excess loss [222; 488]. The high alignment difficulty due to this sensitivity is noted as a challenge for edge coupling. • Context: Alignment is a crucial consideration during optical testing and packaging, and high sensitivity increases the complexity and cost of these processes, which is why techniques like flip-chip bonding and the use of fiber arrays are employed to improve stability and alignment [177; 488].", "reasoning": "'alignment marks' are components designed to achieve precise physical alignment between optical devices. 'Alignment Sensitivity' is the property that quantifies how coupling efficiency degrades with misalignment. Therefore, the purpose of alignment marks is directly related to managing or overcoming the challenge posed by alignment sensitivity.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 20, "evidence_quotes": ["With the smaller optical modes of visible (compared to infrared) LDs, smaller alignment tolerances are encountered when adapting this approach to the visible spectrum, and recent reports of flip-chip LD integration at visible wavelengths [10, 11] have been limited to relatively low optical powers (≈ 1 mW in Ref. 10).", "Simulated 3-dB misalignment tolerances along X, Y, and Z axes were 0.5, 2.1, and 0.2 µm, respectively, which are ≈55%, ≈131%, and ≈25% of the reported infrared (1550 nm) flip-chip LD alignment tolerances in Ref. 9.", "The vision system of the die bonder was used to align corresponding cross- and square-shaped alignment marks on the two chips."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1711", "head": "active photonic circuit", "head_type": "Architecture", "head_description": "An active photonic circuit is a photonic integrated circuit (PIC) that was realized using a hybrid integration approach. It incorporates an externally bonded laser diode with monolithically fabricated on-chip components. The demonstrated circuit consists of a bonded laser diode, a thermo-optic switch, and a monolithically-integrated Si photodetector.", "relation": "PERFORMS_FUNCTION", "tail": "on-chip power monitoring", "tail_type": "Design_Function", "tail_description": "On-chip power monitoring is the demonstrated application for a photonic integrated circuit combining a silicon nitride-on-silicon photodetector with a tunable microring filter. In this function, the photodetector is placed at the through port of the microring to measure the optical power. The measured photocurrent shows a good match with the normalized through port transmission, confirming the feasibility of using the integrated photodetector for this purpose.", "reasoning": "The evidence quote \"An active PIC with a bonded laser, power monitor, and optical switch was realized\" explicitly states that the 'active photonic circuit' (active PIC) includes a 'power monitor'. This indicates the architecture performs the function of power monitoring.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 21, "evidence_quotes": ["The LD is further integrated into an active photonic circuit with a thermo-optic switch and monolithically-integrated Si photodetector.", "As a proof-of-concept PIC demonstration, the InGaN LD was bonded onto a socket connected to a power monitor and an optical switch, Fig. 3(a)."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1742", "head": "folded waveguide", "head_type": "Component", "head_description": "A folded waveguide is a component used in the design of the thermo-optic phase shifter within the Mach-Zehnder interferometer optical switch. Specifically, a 3-pass folded waveguide structure is employed to increase the interaction length within a compact footprint. This waveguide is heated by a titanium nitride heater to induce a phase shift.", "relation": "PERFORMS_FUNCTION", "tail": "Thermo Optic Switch", "tail_type": "Design_Function", "tail_description": "The Thermo_Optic_Switch is listed as a fundamental design function and component utilized to realize an active optical switching function by leveraging the Thermo_Optic_Effect. This type of switch is commonly implemented using a Mach–Zehnder Interferometer (MZI) structure, which can function as a thermo-optic switch if a temperature difference (ΔT) is applied between its two arms. This temperature difference is typically generated using a resistive heater placed on one of the MZI arms. The resulting change in the propagation constant due to the temperature difference causes the MZI's optical output to be a sinusoidally varying function of wavelength and temperature. The thermal dependence exploits silicon's large thermo-optic coefficient (dn/dT=1.87*10^−4 * K^−1) is provided as an example value for silicon).", "reasoning": "The new entity 'folded waveguide' is explicitly described as a component 'used in the design of the thermo-optic phase shifter within the Mach-Zehnder interferometer optical switch'. The candidate entity 'Thermo Optic Switch' is the design function implemented by this MZI switch. Therefore, the folded waveguide is a component that directly contributes to performing the thermo-optic switching function.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 22, "evidence_quotes": ["The optical switch was a Mach-Zehnder interferometer with a 328-µm long TO phase shifter in one arm.", "The phase shifter used a 3-pass folded waveguide structure, a titanium nitride heater, and thermal isolation trenches [1]."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:991", "head": "photodetectors", "head_type": "Component", "head_description": "Integrated photodetectors are components used in programmable photonic circuits to handle the conversion of modulated optical signals back into radiofrequency waves. In conjunction with high-speed modulators, they provide the input and output ports for processing microwave signals on the optical chip. They can be implemented as waveguide-coupled silicon (Si) photodetectors within visible-light silicon photonics platforms, where they are often co-integrated with components such as laser diodes, optical switches, and MEMS devices on silicon nitride (SiN) waveguides to form active photonic circuits.", "relation": "PERFORMS_FUNCTION", "tail": "photon detection", "tail_type": "Design_Function", "tail_description": "Photon detection is the primary function of the monolithically integrated SiN-on-Si photodetectors (PDs). These devices are designed to achieve broadband, high-efficiency photon detection across the entire visible spectrum. This capability is enabled by the leaky-wave design involving a tapered SiN waveguide over a Si mesa.", "reasoning": "The new entity 'photodetectors' is a Component described as handling the 'conversion of modulated optical signals'. This is functionally equivalent to 'photon detection', the candidate Design_Function. A photodetector component performs the function of photon detection.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 23, "evidence_quotes": ["The power monitor consisted of an evanescent directional coupler power tap, which directed tapped light to a 200-µm long, waveguide-coupled, PIN, Si photodetector [6].", "The relationship between PD photocurrent and LD current is shown in Fig. 3(d), showing high linearity beyond the LD threshold current."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1680", "head": "Si photonic chips", "head_type": "Component", "head_description": "Subcomponent of architecture 'passive-alignment flip-chip bonding'", "relation": "PERFORMS_FUNCTION", "tail": "mode matching", "tail_type": "Design_Function", "tail_description": "Mode matching is a design function of the SiN inverse taper edge couplers. These couplers are specifically designed to match the optical mode of the bonded laser diode (LD), which is essential for achieving efficient optical coupling between the LD and the Si photonic chip.", "reasoning": "The Si photonic chips contain 'SiN inverse taper edge couplers... designed for mode matching'. Therefore, the chip as a whole performs this function to couple light from the laser diode.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 24, "evidence_quotes": ["SiN inverse taper edge couplers (150-nm nominal tip width, designed for mode matching to the LD) at the socket facets enabled optical coupling between the Si photonic chips and bonded LDs."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1725", "head": "modal mismatch", "head_type": "Physical_Principle", "head_description": "Modal mismatch is a source of optical loss that occurs when the spatial profile of the optical mode from the laser diode does not perfectly match the mode profile of the receiving SiN waveguide. According to optical mode simulations, modal mismatch accounts for 2.7 dB of coupling loss even under optimal alignment conditions.", "relation": "RELATED_TO", "tail": "SiN waveguide", "tail_type": "Component", "tail_description": "The SiN (silicon nitride) waveguide is an optical component used to guide light on the chip to the SPAD. The routing waveguides have a specified thickness of 150 nm and a nominal width of 500 nm. Light is coupled from this waveguide into the underlying Si mesa via evanescent coupling. To enhance this coupling efficiency at the detector, the waveguide is narrowed to 250 nm over the PN junction. The separation between the SiN waveguide and the Si mesa is about 150 nm.", "reasoning": "The description of 'modal mismatch' explicitly defines it as a source of optical loss that occurs between a source (like a laser diode) and a 'receiving SiN waveguide'. The candidate entity is a specific instance of a SiN waveguide, making this relationship directly supported by the provided context.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 25, "evidence_quotes": ["Comparing the bonded LD with a separate reference LD attached to a printed circuit board (50-mA pulsed operation), we calculate an LD-to-SiN-waveguide coupling loss of 4.8 dB.", "Optical mode simulations indicate an optimally-aligned coupling loss (due to modal mismatch) of 2.7 dB, and hence, ≈2.1 dB of excess Authorized licensed use limited to: The University of Toronto."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1730", "head": "power monitor", "head_type": "Architecture", "head_description": "The power monitor is an on-chip circuit designed to measure optical power in a waveguide. It is a component of the demonstrated active Photonic Integrated Circuit (PIC). The monitor is composed of an evanescent directional coupler that taps a fraction of the light and a waveguide-coupled PIN Si photodetector that converts the tapped light into an electrical signal.", "relation": "PERFORMS_FUNCTION", "tail": "photon detection", "tail_type": "Design_Function", "tail_description": "Photon detection is the primary function of the monolithically integrated SiN-on-Si photodetectors (PDs). These devices are designed to achieve broadband, high-efficiency photon detection across the entire visible spectrum. This capability is enabled by the leaky-wave design involving a tapered SiN waveguide over a Si mesa.", "reasoning": "The 'power monitor' architecture is described as containing a 'PIN, Si photodetector'. The fundamental function of a photodetector is 'photon detection'. Therefore, to perform its main function of power monitoring, the power monitor architecture must perform the sub-function of photon detection.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 26, "evidence_quotes": ["The power monitor consisted of an evanescent directional coupler power tap, which directed tapped light to a 200-µm long, waveguide-coupled, PIN, Si photodetector [6].", "The relationship between PD photocurrent and LD current is shown in Fig. 3(d), showing high linearity beyond the LD threshold current."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1732", "head": "power monitor", "head_type": "Architecture", "head_description": "The power monitor is an on-chip circuit designed to measure optical power in a waveguide. It is a component of the demonstrated active Photonic Integrated Circuit (PIC). The monitor is composed of an evanescent directional coupler that taps a fraction of the light and a waveguide-coupled PIN Si photodetector that converts the tapped light into an electrical signal.", "relation": "USES_COMPONENT", "tail": "silicon nitride-on-silicon waveguide photodetectors", "tail_type": "Component", "tail_description": "Silicon nitride-on-silicon waveguide photodetectors are devices monolithically integrated into a visible light photonic platform on silicon. They operate based on a leaky-wave design, where light from a SiN waveguide evanescently couples into a silicon mesa for detection. These detectors demonstrate high performance across a broad visible spectrum, achieving high external quantum efficiency, fast opto-electronic bandwidth, and can also function as avalanche photodiodes with a significant gain-bandwidth product. As a proof-of-concept, a photodetector was integrated with a tunable microring for on-chip power monitoring.", "reasoning": "The evidence for the 'power monitor' (Architecture) states it uses a 'waveguide-coupled, PIN, Si photodetector'. The candidate entity is a specific type of waveguide photodetector. This is a valid USES_COMPONENT relationship, linking the architecture to a specific component implementation it can use.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 27, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1702", "head": "passive-alignment flip-chip bonding", "head_type": "Architecture", "head_description": "Passive-alignment flip-chip bonding is a hybrid integration technique used to mount blue InGaN laser diodes onto a foundry-fabricated visible-light silicon photonics platform. This method utilizes lithographically-defined alignment structures and mechanical stoppers on both the silicon photonic chips and the laser diodes to achieve alignment without active power-on optimization. This integration scheme enables the realization of active photonic integrated circuits (PICs) that include the bonded laser, a power monitor, and an optical switch, achieving on-chip optical powers up to 9.6 mW.", "relation": "HAS_PROPERTY", "tail": "high optical power", "tail_type": "Property", "tail_description": "A characteristic capability of silicon nitride (Si3N4) waveguides, allowing them to support high-intensity light with minimal induced nonlinear optical phase shifts. This property is particularly important for linear applications and is often achieved in designs with a large mode field area (MFA). For example, a 40-nm core design has an MFA of approximately 28 µm², which is suited for high power handling. Waveguides designed for high power can also exhibit highly selective polarization propagation, with transverse magnetic loss exceeding 75 dB relative to the transverse electric mode.", "reasoning": "The evidence quotes directly state that the 'passive-alignment flip-chip bonding' technique allows the system to \"achieve continuous-wave on-chip optical powers up to 9.6 mW\". This directly links the architecture to the property of enabling or achieving 'high optical power'.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 28, "evidence_quotes": ["In this work, we demonstrate passive-alignment flip-chip bonding of 450-nm wavelength indium gallium nitride (InGaN) lasers in a foundry-fabricated visible-light Si photonics platform.", "With lithographically-defined alignment structures and mechanical stoppers on both the Si photonic chips and LDs, we achieve continuous-wave on-chip optical powers up to 9.6 mW - an order of magnitude beyond previous reports [10,11] and comparable to actively-aligned LD demonstrations [7,8]."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1691", "head": "Thermo-optic Switch", "head_type": "Component", "head_description": "A thermo-optic switch is a component used in active photonic circuits to provide active control over the optical signal path. It is often co-integrated on a photonic integrated circuit with other components, such as monolithically-integrated photodetectors and hybrid-integrated laser diodes.", "relation": "RELATED_TO", "tail": "thermal isolation", "tail_type": "Design_Function", "tail_description": "Thermal isolation is a design function implemented in photonic platforms to prevent heat from spreading between components. This is achieved through fabrication steps like a deep trench etch and an optional undercut etch in the Si substrate. This technique is commonly applied to thermo-optic (TO) phase shifters to improve their efficiency by suspending the heated waveguide section, thereby reducing heat loss to the substrate. The suspension can be created using periodic deep trench windows followed by an undercut etch.", "reasoning": "The candidate entity description for 'thermal isolation' states that this design function is 'commonly applied to thermo-optic (TO) phase shifters to improve their efficiency'. Since thermo-optic switches are typically built using thermo-optic phase shifters, thermal isolation is a critical and directly related design function for creating efficient thermo-optic switches.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 29, "evidence_quotes": ["The optical switch was a Mach-Zehnder interferometer with a 328-µm long TO phase shifter in one arm.", "The phase shifter used a 3-pass folded waveguide structure, a titanium nitride heater, and thermal isolation trenches [1]."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1675", "head": "laser diode", "head_type": "Component", "head_description": "Subcomponent of architecture 'active photonic circuit'", "relation": "RELATED_TO", "tail": "P and N contacts", "tail_type": "Component", "tail_description": "P and N contacts are the electrical terminals on the InGaN laser diodes. The lasers are designed with top-side P and N contacts, which enables electrical connectivity to the Si photonic chips. This connection is physically made via solder bumps and UBM wires/pads.", "reasoning": "The text says 'The lasers featured top-side P and N contacts'. This implies a 'has-part' relationship. Since COMPOSED_OF is for PDK cells, RELATED_TO is the most suitable existing type.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 30, "evidence_quotes": ["The lasers featured top-side P and N contacts - enabling electrical connectivity to the Si photonic chips via the solder bumps and UBM wires/pads."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:185", "head": "Thermo-optic Switch", "head_type": "Component", "head_description": "A thermo-optic switch is a component used in active photonic circuits to provide active control over the optical signal path. It is often co-integrated on a photonic integrated circuit with other components, such as monolithically-integrated photodetectors and hybrid-integrated laser diodes.", "relation": "PERFORMS_FUNCTION", "tail": "Optical Switch", "tail_type": "Design_Function", "tail_description": "The Optical_Switch is listed as a fundamental design function in photonic integrated circuits. This functionality is commonly implemented using components that rely on active phase shifting, most notably the Mach–Zehnder Interferometer (MZI) structure. When incorporated into an MZI, the device can function as a Thermo-optic switch by applying a temperature difference (ΔT) between the two arms. The switch operates by exploiting the Thermo_Optic_Effect in silicon, where a temperature increase in one arm causes a change in the propagation constant (β2). This thermal change results in the MZI output exhibiting a sinusoidally varying function of wavelength and temperature. Alternative designs often utilize electrical components like PIN phase shifters inside MZIs or ring structures to achieve high-speed switching. Given the thermal sensitivity of silicon photonic devices, minimizing the power consumption required for trimming large arrays of Mach–Zehnder switches is a critical design challenge.", "reasoning": "A 'Thermo-optic Switch' is a specific type of component whose primary purpose is to perform the function of an 'Optical Switch'. The candidate entity description for Optical Switch confirms this link by describing how a device can function as a Thermo-optic switch. The relationship is definitional.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 31, "evidence_quotes": ["A growing body of literature has demonstrated fundamental building blocks for visible-light integrated photonics, including thermo-optic (TO) optical switches [1], strain-optic modulators [4], photodetectors (PDs) [5,6], and microelectromechanical systems (MEMS) beam scanners [1].", "The LD is further integrated into an active photonic circuit with a thermo-optic switch and monolithically-integrated Si photodetector."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1685", "head": "photodetectors", "head_type": "Component", "head_description": "Integrated photodetectors are components used in programmable photonic circuits to handle the conversion of modulated optical signals back into radiofrequency waves. In conjunction with high-speed modulators, they provide the input and output ports for processing microwave signals on the optical chip. They can be implemented as waveguide-coupled silicon (Si) photodetectors within visible-light silicon photonics platforms, where they are often co-integrated with components such as laser diodes, optical switches, and MEMS devices on silicon nitride (SiN) waveguides to form active photonic circuits.", "relation": "RELATED_TO", "tail": "Modulator", "tail_type": "Design_Function", "tail_description": "A Modulator is a design function and active component used to achieve optical modulation and tuning. Modulators function by leveraging physical principles to vary the concentration of carriers, either through carrier depletion (in a pn-junction) or carrier injection (in a PIN junction), or by utilizing the thermo-optic effect to achieve tuning. These effects result in changes to the silicon's refractive index, a mechanism known as the plasma dispersion effect. Common modulator implementations include Mach-Zehnder Interferometer (MZI) structures, which are typically used for amplitude modulation, and resonant structures such as Micro-ring Modulators. Modulator performance has significantly improved since the first GHz silicon modulator demonstration, with high-speed devices experimentally demonstrated up to 50 Gbit/s. Resonant structures can lead to a reduced device footprint and reduced power consumption, with ultra-low metrics such as 7 fJ/bit demonstrated. The design of these active components requires the use of optoelectronic models and Technology Computer Aided Design (TCAD) tools.", "reasoning": "The description of the new entity 'photodetectors' explicitly states that 'In conjunction with high-speed modulators, they provide the input and output ports...'. This indicates a direct, complementary relationship between photodetectors and modulators within a system. 'RELATED_TO' is the most appropriate edge type.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 32, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1728", "head": "modal mismatch", "head_type": "Physical_Principle", "head_description": "Modal mismatch is a source of optical loss that occurs when the spatial profile of the optical mode from the laser diode does not perfectly match the mode profile of the receiving SiN waveguide. According to optical mode simulations, modal mismatch accounts for 2.7 dB of coupling loss even under optimal alignment conditions.", "relation": "RELATED_TO", "tail": "waveguides", "tail_type": "Component", "tail_description": "On-chip waveguides are fundamental building blocks of programmable photonic integrated circuits that guide the flow of light. They are commonly included as standard components, often represented as parametric cells (PCells), in photonic design kits (PDKs). In circuit design, they are connected in a mesh topology, linking other components such as tunable beam couplers and 2x2 optical gates. During the layout phase, specialized routing algorithms like river routers are employed to connect groups of parallel waveguides without allowing them to cross. By interfering signals along different paths defined by the waveguide mesh, various linear functions and optical computations can be performed.", "reasoning": "The description of 'modal mismatch' explicitly defines it as a phenomenon occurring at the interface with a waveguide ('does not perfectly match the mode profile of the receiving SiN waveguide'). This physical principle is a key factor affecting the performance of waveguides, specifically in coupling light into them. The proposed novel edge type 'AFFECTS' accurately describes this relationship where a physical principle has an impact on a component.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 33, "evidence_quotes": ["Comparing the bonded LD with a separate reference LD attached to a printed circuit board (50-mA pulsed operation), we calculate an LD-to-SiN-waveguide coupling loss of 4.8 dB.", "Optical mode simulations indicate an optimally-aligned coupling loss (due to modal mismatch) of 2.7 dB, and hence, ≈2.1 dB of excess loss due to misalignment after bonding."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1704", "head": "hybrid laser", "head_type": "Architecture", "head_description": "A compact laser architecture created by combining different material platforms. One demonstrated version consists of an Indium Phosphide (InP) gain block coupled to a high-Q Si3N4 microring resonator (MRR), which functions as an external laser mirror. This configuration achieved an integral linewidth of 13 kHz. A variation of this design incorporates a long photon lifetime Si3N4 MRR as a tuning section, resulting in a tunable wavelength output and a fundamental linewidth of less than 300 Hz.", "relation": "HAS_PROPERTY", "tail": "on-chip optical powers", "tail_type": "Property", "tail_description": "On-chip optical power is a key performance metric for the integrated laser diode within the silicon photonics platform. A continuous-wave (CW) on-chip optical power of 9.6 mW was demonstrated. This result was achieved through the use of a hybrid integration scheme involving passive-alignment flip-chip bonding with lithographically-defined alignment structures and mechanical stoppers.", "reasoning": "The new entity's description specifies that the high on-chip optical power was achieved using a 'hybrid integration scheme'. The candidate entity is a 'hybrid laser' architecture. This directly links a type of laser architecture to a key performance property it exhibits.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 34, "evidence_quotes": ["We report hybrid integration of blue InGaN laser diodes in a visible-light silicon photonics platform using passive-alignment flip-chip bonding.", "We demonstrate continuous-wave on-chip optical powers of 9.6 mW and integration with optical switches and photodetectors."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1724", "head": "modal mismatch", "head_type": "Physical_Principle", "head_description": "Modal mismatch is a source of optical loss that occurs when the spatial profile of the optical mode from the laser diode does not perfectly match the mode profile of the receiving SiN waveguide. According to optical mode simulations, modal mismatch accounts for 2.7 dB of coupling loss even under optimal alignment conditions.", "relation": "RELATED_TO", "tail": "SiN waveguides", "tail_type": "Component", "tail_description": "Flagged: MetricConflict:propagation loss", "reasoning": "The description of 'modal mismatch' explicitly defines it as a source of optical loss that occurs between a laser diode and a 'receiving SiN waveguide'. This directly links the physical principle to the component type, as it is a phenomenon that affects the component's performance.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 35, "evidence_quotes": ["Comparing the bonded LD with a separate reference LD attached to a printed circuit board (50-mA pulsed operation), we calculate an LD-to-SiN-waveguide coupling loss of 4.8 dB.", "Optical mode simulations indicate an optimally-aligned coupling loss (due to modal mismatch) of 2.7 dB, and hence, ≈2.1 dB of excess loss due to misalignment after bonding."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1672", "head": "active photonic circuit", "head_type": "Architecture", "head_description": "An active photonic circuit is a photonic integrated circuit (PIC) that was realized using a hybrid integration approach. It incorporates an externally bonded laser diode with monolithically fabricated on-chip components. The demonstrated circuit consists of a bonded laser diode, a thermo-optic switch, and a monolithically-integrated Si photodetector.", "relation": "USES_COMPONENT", "tail": "photodetectors", "tail_type": "Component", "tail_description": "Integrated photodetectors are components used in programmable photonic circuits to handle the conversion of modulated optical signals back into radiofrequency waves. In conjunction with high-speed modulators, they provide the input and output ports for processing microwave signals on the optical chip. They can be implemented as waveguide-coupled silicon (Si) photodetectors within visible-light silicon photonics platforms, where they are often co-integrated with components such as laser diodes, optical switches, and MEMS devices on silicon nitride (SiN) waveguides to form active photonic circuits.", "reasoning": "The evidence explicitly states that the 'active photonic circuit' contains a 'monolithically-integrated Si photodetector'. This directly supports the relationship that the architecture uses a photodetector component. The edge type USES_COMPONENT (Architecture -> Component) is appropriate.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 36, "evidence_quotes": ["The LD is further integrated into an active photonic circuit with a thermo-optic switch and monolithically-integrated Si photodetector."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1710", "head": "alignment structures", "head_type": "Component", "head_description": "Alignment structures are lithographically-defined features fabricated on both the Si photonic chips and the laser diodes (LDs). They are used in conjunction with mechanical stoppers to enable the passive-alignment flip-chip bonding process. This method facilitates the achievement of high on-chip optical powers, such as 9.6 mW, without requiring active alignment.", "relation": "RELATED_TO", "tail": "high optical power", "tail_type": "Property", "tail_description": "A characteristic capability of silicon nitride (Si3N4) waveguides, allowing them to support high-intensity light with minimal induced nonlinear optical phase shifts. This property is particularly important for linear applications and is often achieved in designs with a large mode field area (MFA). For example, a 40-nm core design has an MFA of approximately 28 µm², which is suited for high power handling. Waveguides designed for high power can also exhibit highly selective polarization propagation, with transverse magnetic loss exceeding 75 dB relative to the transverse electric mode.", "reasoning": "The evidence quote directly states that 'With lithographically-defined alignment structures... we achieve continuous-wave on-chip optical powers up to 9.6 mW'. This shows that the component 'alignment structures' is a key enabler for the system to achieve the 'high optical power' property. A new edge type 'ENABLES_PROPERTY' is proposed as the component facilitates this property rather than possessing it directly, making it distinct from 'HAS_PROPERTY'.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 37, "evidence_quotes": ["With lithographically-defined alignment structures and mechanical stoppers on both the Si photonic chips and LDs, we achieve continuous-wave on-chip optical powers up to 9.6 mW - an order of magnitude beyond previous reports [10,11] and comparable to actively-aligned LD demonstrations [7,8]."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1753", "head": "Pπ", "head_type": "Property", "head_description": "Pπ is a key performance metric for a thermo-optic switch, representing the electrical power required to induce a π (180-degree) phase shift in one arm of the Mach-Zehnder interferometer. For the demonstrated optical switch, the two outputs exhibited Pπ values of 12.8 mW and 12.0 mW.", "relation": "RELATED_TO", "tail": "optical switch", "tail_type": "Component", "tail_description": "A component that can dynamically route an optical signal. In the context of a 2-D lattice mesh network, an optical switch is one of the functional configurations of a programmable Mach-Zehnder (MZ) coupler. This switching capability is enabled by using thermal phase tuning elements to control the state of the MZ coupler.", "reasoning": "The new entity 'Pπ' is explicitly defined in its description as \"a key performance metric for a thermo-optic switch\". The evidence provides measured Pπ values for an optical switch. This establishes a direct relationship where Pπ is a property of the optical switch component. The edge type `RELATED_TO` is used as the standard `HAS_PROPERTY` edge is defined from Component to Property.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 38, "evidence_quotes": ["The extinction ratio (ER) and power dissipation for a π radian phase shift (Pπ ) for the optical switch and phase shifter, respectively, were calculated from the first half-period of Fig. 3(c)."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1735", "head": "power monitor", "head_type": "Architecture", "head_description": "The power monitor is an on-chip circuit designed to measure optical power in a waveguide. It is a component of the demonstrated active Photonic Integrated Circuit (PIC). The monitor is composed of an evanescent directional coupler that taps a fraction of the light and a waveguide-coupled PIN Si photodetector that converts the tapped light into an electrical signal.", "relation": "PERFORMS_FUNCTION", "tail": "Power Splitter", "tail_type": "Design_Function", "tail_description": "The Power Splitter is a fundamental design function used to split light from one waveguide equally into two waveguides (splitter), or to combine light from two waveguides into one (combiner). This capability is critical for constructing photonic integrated circuits, particularly in devices like the Mach–Zehnder interferometer. When operating as a splitter, an input intensity (Ii) is split equally such that each output has intensity I1 = I2 = Ii /2, and the device functions as a 50/50% beam-splitter in both the splitting and combining directions. Power splitters are implemented using fundamental components such as the Y-Branch and the Directional Coupler.", "reasoning": "The evidence explicitly states that the 'power monitor' includes an 'evanescent directional coupler power tap'. A power tap is a device whose function is to split a fraction of optical power from a waveguide, which is a specific implementation of the 'Power Splitter' design function. Therefore, the power monitor architecture performs this function as part of its operation.", "source_document": "05_Mu_Flip-Chip_Bonded_Laser_Diodes_OFC2025", "shown_order": 39, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}]}/*__BUNDLE_END__*/;

const REL_PHRASE = {

  RELATED_TO:"is related to"
};
function phrase(rel){ return REL_PHRASE[rel] || rel.toLowerCase().replace(/_/g," "); }

function save(){ localStorage.setItem(KEY, JSON.stringify({responses, idx, startedAt})); }
function accrue(){ if(enterTs){ const it=items[idx]; if(it){ const r=responses[it.id]||(responses[it.id]={label:null,time_ms:0}); r.time_ms += Math.round(performance.now()-enterTs); } } }

function setLabel(label){
  accrue(); const it=items[idx];
  (responses[it.id]||(responses[it.id]={time_ms:0})).label = label;
  save();
  if(idx < items.length-1){ idx++; render(); } else { render(); }
}
function go(d){ accrue(); idx = Math.max(0, Math.min(items.length-1, idx+d)); save(); render(); }

function answeredCount(){ return Object.values(responses).filter(r=>r&&r.label).length; }

  const quotes = (Array.isArray(it.evidence_quotes)?it.evidence_quotes:[it.evidence_quotes])
                   .filter(Boolean).map(q=>`<p class="quote">${escapeHtml(q)}</p>`).join("");

  main.innerHTML = `
