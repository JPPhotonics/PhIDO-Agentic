lti-point neural stimulation.", "reasoning": "The 'eight-beam probe' is described as a specific implementation of an implantable nanophotonic probe. The evidence for 'power-monitoring feedback' indicates it is a function that supports 'nanophotonic neural probes' by ensuring stable power delivery. Therefore, the function supports this specific probe architecture. The proposed new edge type 'SUPPORTS' is applicable.", "source_document": "13_neuralprobe_patterned_photostim_npjBiosensing2025", "shown_order": 4, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1627", "head": "single-shank probe", "head_type": "Architecture", "head_description": "One of two specific neural probe designs reported, which is optimized for localized stimulation. This architecture consists of a single shank that integrates 18 electrodes for recording and 16 low-divergence emitters for optical stimulation.", "relation": "PERFORMS_FUNCTION", "tail": "patterned illumination", "tail_type": "Design_Function", "tail_description": "Patterned illumination is a technique for targeted neural stimulation used in optogenetics for brain activity mapping. Due to optical scattering in brain tissue, delivering this illumination to deep brain regions requires light-emitting implants. The silicon neural probes detailed in the paper are designed to generate tailored beam patterns to achieve patterned illumination without lenses.", "reasoning": "The new entity 'single-shank probe' is described as being designed for 'localized stimulation'. The candidate entity 'patterned illumination' is a 'technique for targeted neural stimulation'. 'Localized stimulation' is a form of 'patterned illumination', therefore the probe architecture performs this design function.", "source_document": "13_neuralprobe_patterned_photostim_npjBiosensing2025", "shown_order": 5, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1566", "head": "single-shank probe", "head_type": "Architecture", "head_description": "One of two specific neural probe designs reported, which is optimized for localized stimulation. This architecture consists of a single shank that integrates 18 electrodes for recording and 16 low-divergence emitters for optical stimulation.", "relation": "USES_COMPONENT", "tail": "microelectrodes", "tail_type": "Component", "tail_description": "Microelectrodes are integrated into the silicon neural probe platform to enable simultaneous electrophysiological recordings alongside optical stimulation. These components are fabricated from biocompatible titanium nitride (TiN) deposited on the probe's surface and can be monolithically integrated with nanophotonic waveguides using standard PIC fabrication processes. They are connected via three aluminum metal layers for routing signals. To improve recording quality, a post-fabrication laser treatment can be applied locally to the electrodes to reduce their impedance for low-noise measurements.", "reasoning": "The evidence quote explicitly states that the 'single-shank probe' architecture has \"18 electrodes\". The candidate entity 'microelectrodes' is the component type for these electrodes. Therefore, the 'single-shank probe' architecture uses the 'microelectrodes' component.", "source_document": "13_neuralprobe_patterned_photostim_npjBiosensing2025", "shown_order": 6, "evidence_quotes": ["Here, we overcome this challenge with foundry-fabricated implantable silicon neural probes with microelectrodes and nanophotonic circuits."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1605", "head": "neurophotonic probe", "head_type": "Architecture", "head_description": "A proof-of-concept implantable device designed for optogenetic stimulation of rodent brains. The probe is fabricated on antable neural probes, which deliver light of specific wavelengths to activate or inhibit genetically modified neurons. For targeted neural stimulation, patterned illumination is crucial. The delivered wavelength is tailored to match the excitation spectra of the light-sensitive proteins (opsins) expressed by the neurons. Due to optical scattering in brain tissue, light-emitting implants are necessary to deliver patterned light to deep brain regions. The probes deliver sufficient light intensities for this purpose, and the function can operate concurrently with electrophysiology recording or be used with fluorophores for imaging. It is a technique commonly applied in animal models, such as rodent brains.", "reasoning": "The evidence explicitly states that 'low-divergence emitters' are used for 'stimulation'. Given the context of nanophotonic neural probes, this refers to 'optogenetic stimulation'. Therefore, the component ('low-divergence emitters') performs the design function ('optogenetic stimulation').", "source_document": "13_neuralprobe_patterned_photostim_npjBiosensing2025", "shown_order": 8, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1616", "head": "laser scanning system", "head_type": "Architecture", "head_description": "An external system designed for stable optical power delivery to the nanophotonic neural probes. It is characterized by a compact size and incorporates power-monitoring feedback and polarization-insensitive features. This system is used to couple light into a custom multicore fiber (MCF), which then addresses individual optical inputs on the probe chip.", "relation": "PERFORMS_FUNCTION", "tail": "Optical Input Output Coupler", "tail_type": "Design_Function", "tail_description": "The Optical_Input_Output_Coupler is a fundamental design function and a critical component for interfacing the photonic int ernal components, such as a multi-core fiber (MCF) to the chip, is another notable contributor to the overall insertion loss.", "reasoning": "The new entity 'Insertion Loss' is described as a 'fundamental property of optical devices'. The candidate entity 'On-chip amplifiers' is a type of optical component. The description for on-chip amplifiers even states they are used 'to compensate for the higher optical losses accumulated in extensive waveguide meshes,' confirming that loss is a key property in the context of these devices. Therefore, an On-chip amplifier HAS_PROPERTY Insertion Loss.", "source_document": "13_neuralprobe_patterned_photostim_npjBiosensing2025", "shown_order": 20, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1590", "head": "grating-based light emitters", "head_type": "Architecture", "head_description": "Grating-based light emitters are integrated nanophotonic circuits on silicon neural probes designed to generate a single, steerable beam for optogenetic stimulation. These emitters are optimized for blue or amber light. The core architecture combines end-fire optical phased arrays with slab gratings, a configuration that serves to suppress higher-order sidelobes and achieve continuous single-beam scanning.", "relation": "HAS_PROPERTY", "tail": "engineered beam profiles", "tail_type": "Property", "tail_description": "A characteristic of the light output from the nanophotonic neural probes, which is specifically tailored for photostimulation. These profiles, which include low-divergence beams and planar sheets, are designed to deliver high optical power and selectively stimulate neurons at various depths within tissue.", "reasoning": "The candidate entity 'grating-based light emitters' is an architecture designed to generate a steerable beam. A steerable beam is a form of an 'engineered beam profile'. Therefore,  "Architecture", "head_description": "One of two specific neural probe designs reported, which is optimized for localized stimulation. This architecture consists of a single shank that integrates 18 electrodes for recording and 16 low-divergence emitters for optical stimulation.", "relation": "HAS_PROPERTY", "tail": "emitter pitch", "tail_type": "Property", "tail_description": "The center-to-center spacing between adjacent emitters in an optical phased array. To achieve single lobe emission and avoid grating lobes, an emitter pitch of half the operating wavelength (λ/2) is typically required. This can be challenging to fabricate for visible light applications. The presented OPA architecture circumvents this requirement by using a free-propagation region slab for spatial filtering.", "reasoning": "The 'single-shank probe' is described as having '16...emitters'. An array of emitters inherently possesses the physical property of 'emitter pitch' (the spacing between them). Therefore, the architecture has this property.", "source_document": "13_neuralprobe_patterned_photostim_npjBiosensing2025", "shown_order": 23, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1643", "head": "light sheet emitters", "head_type": "Component", "head_description": "Optical components integrated into the four-shank neural probe, designed to generate light sheets for widespread planar stimulation. Each of the 5 light sheet emitters is formed by the overlapping emissions from an array of 8 underlying grating emitters. These grating emitters have a narrow width (0.8 µm) compared to low-divergence emitters, a design choice made to achieve a large beam divergence angle along the beam width.", "relation": "RELATED_TO", "tail": "neurophotonic probe", "tail_type": "Architecture", "tail_description": "A proof-of-concept implantable device designed for optogenetic s ess than -16 dB. When compared to other, more distant gratings, this ratio was even lower: < -20 dB for the LD probe and < -17 dB for the LS probe.", "reasoning": "The new entity 'residual power' is a property related to unintended light emission, which is a critical performance characteristic for any phased array designed to control far-field radiation. The candidate entity, a 'nanophotonic phased array', is such a device. It is logical that this architecture would be characterized by the property of residual power.", "source_document": "13_neuralprobe_patterned_photostim_npjBiosensing2025", "shown_order": 25, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1642", "head": "light sheet emitters", "head_type": "Component", "head_description": "Optical components integrated into the four-shank neural probe, designed to generate light sheets for widespread planar stimulation. Each of the 5 light sheet emitters is formed by the overlapping emissions from an array of 8 underlying grating emitters. These grating emitters have a narrow width (0.8 µm) compared to low-divergence emitters, a design choice made to achieve a large beam divergence angle along the beam width.", "relation": "RELATED_TO", "tail": "grating-based light emitters", "tail_type": "Architecture", "tail_description": "Grating-based light emitters are integrated nanophotonic circuits on silicon neural probes designed to generate a single, steerable beam for optogenetic stimulation. These emitters are optimized for blue or amber light. The core architecture combines end-fire optical phased arrays with slab gratings, a configuration that serves to suppress higher-order sidelobes and achieve continuous single-beam scanning.", "reasoning": "The evidence explicitly states that the 'light sheet emitters' are \"formed by overlapping emissions from an array of 8 grating emitters\ acterized by a compact size and incorporates power-monitoring feedback and polarization-insensitive features. This system is used to couple light into a custom multicore fiber (MCF), which then addresses individual optical inputs on the probe chip.", "relation": "RELATED_TO", "tail": "optogenetic stimulation", "tail_type": "Design_Function", "tail_description": "A primary application of implantable neural probes, which deliver light of specific wavelengths to activate or inhibit genetically modified neurons. For targeted neural stimulation, patterned illumination is crucial. The delivered wavelength is tailored to match the excitation spectra of the light-sensitive proteins (opsins) expressed by the neurons. Due to optical scattering in brain tissue, light-emitting implants are necessary to deliver patterned light to deep brain regions. The probes deliver sufficient light intensities for this purpose, and the function can operate concurrently with electrophysiology recording or be used with fluorophores for imaging. It is a technique commonly applied in animal models, such as rodent brains.", "reasoning": "The 'laser scanning system' is an external system that provides stable optical power to the neural probes. The neural probes, in turn, use this light to perform 'optogenetic stimulation'. Therefore, the laser scanning system is a critical enabling component for this function, even though it does not perform the stimulation directly. A new edge type `ENABLES_FUNCTION` is proposed to capture this relationship where an architecture is a prerequisite for a function performed by another part of the overall system.", "source_document": "13_neuralprobe_patterned_photostim_npjBiosensing2025", "shown_order": 29, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1611", "head": "nanophotonic neural probes", "head_type": "Architecture", "head const REL_PHRASE = {
  PERFORMS_FUNCTION:"performs the function of", BASED_ON_PRINCIPLE:"is based on the principle of",
  HAS_PROPERTY:"has the property", USES_COMPONENT:"uses the component", IMPLEMENTS:"implements",
  EXHIBITS:"exhibits", FABRICATED_WITH:"is fabricated with", COMPOSED_OF:"is composed of",
  RELATED_TO:"is related to"
};
function phrase(rel){ return REL_PHRASE[rel] || rel.toLowerCase().replace(/_/g," "); }
// Internal label values are kept (supported/not_supported/skip) for analysis compatibility;
// these are how they read to the annotator under the relationship-validity task.
const LABEL_DISPLAY = { supported:"correct", not_supported:"incorrect", skip:"unsure" };

const KEY = "phido_labels_" + BUNDLE.annotator_id;
const items = BUNDLE.items;
let responses = {};            // id -> {label, time_ms}
let idx = 0;
let enterTs = 0;
const startedAt = new Date().toISOString();

// restore any in-progress session
try { const s = JSON.parse(localStorage.getItem(KEY) || "{}"); responses = s.responses || {}; idx = s.idx || 0; } catch(e){}

function save(){ localStorage.setItem(KEY, JSON.stringify({responses, idx, startedAt})); }
function accrue(){ if(enterTs){ const it=items[idx]; if(it){ const r=responses[it.id]||(responses[it.id]={label:null,time_ms:0}); r.time_ms += Math.round(performance.now()-enterTs); } } }

function setLabel(label){
  accrue(); const it=items[idx];
  (responses[it.id]||(responses[it.id]={time_ms:0})).label = label;
  save();
  if(idx < items.length-1){ idx++; render(); } else { render(); }
}
function go(d){ accrue(); idx = Math.max(0, Math.min(items.length-1, idx+d)); save(); render(); }

function answeredCount(){ return Object.values(responses).filter(r=>r&&r.label).length; }

function render(){
  document.getElementById("who").textContent = "annotator: " + BUNDLE.annotator_id;
  const done = answeredCount();
  document.getElementById("counter").textContent = done + " / " + items.length;
  document.getElementById("barfill").style.width = (100*done/items.length) + "%";

  const main = document.getElementById("main");
  if(idx >= items.length){ idx = items.length-1; }
  const it = items[idx];
  const cur = responses[it.id] && responses[it.id].label;
  const quotes = (Array.isArray(it.evidence_quotes)?it.evidence_quotes:[it.evidence_quotes])
                   .filter(Boolean).map(q=>`<p class="quote">${escapeHtml(q)}</p>`).join("");

  main.innerHTML = `
    <div class="instr">${escapeHtml(BUNDLE.instructions||"")}</div>
    <div class="card">
      <div class="reltype">${escapeHtml(it.head_type||"")} → ${escapeHtml(it.relation)} → ${escapeHtml(it.tail_type||"")}</div>
      <div class="reldef">${escapeHtml((BUNDLE.relation_definitions||{})[it.relation]||"")}</div>
      <div class="stmt"><b>${escapeHtml(it.head)}</b> ${escapeHtml(phrase(it.relation))} <b>${escapeHtml(it.tail)}</b>.</div>
      <div class="entdefs">
        <div><span class="ent">${escapeHtml(it.head)}</span>${it.head_description?" — "+escapeHtml(it.head_description):' <span class="nodesc">(no description in KG)</span>'}</div>
        <div><span class="ent">${escapeHtml(it.tail)}</span>${it.tail_description?" — "+escapeHtml(it.tail_description):' <span class="nodesc">(no description in KG)</span>'}</div>
      </div>
      <div class="q">Is this relationship <b>correct</b>?</div>
      <div class="evlabel">Supporting evidence the system found (context — the relationship may be inferred):</div>
      <div class="quotes">${quotes || '<span style="color:var(--skip)">(no evidence provided)</span>'}</div>
      <div class="actions">
        <button class="b-sup ${cur==='supported'?'chosen':''}" onclick="setLabel('supported')">Correct &nbsp;<small>(f)</small></button>
        <button class="b-not ${cur==='not_supported'?'chosen':''}" onclick="setLabel('not_supported')">Incorrect &nbsp;<small>(j)</small></button>
        <button class="b-skip ${cur==='skip'?'chosen':''}" onclick="setLabel('skip')">Unsure &nbsp;<small>(s)</small></button>
      </div>
      <details class="reasoning" ontoggle="onReasoning('${it.id}', this)">
        <summary>Show the system's reasoning for this relationship (optional)</summary>
        <div class="rtext">${it.reasoning ? escapeHtml(it.reasoning) : '(no reasoning recorded)'}</div>
      </details>
      <div class="nav">
        <span><a onclick="go(-1)">‹ Prev</a></span>
        <span>item ${idx+1} of ${items.length}${cur?` · <span style="color:var(--accent)">${LABEL_DISPLAY[cur]||cur}</span>`:""}</span>
        <span><a onclick="go(1)">Next ›</a></span>
      </div>
      <div class="kbd">keys: <b>f</b> correct · <b>j</b> incorrect · <b>s</b> unsure · ←/→ navigate</div>
      <details class="glossary"><summary>What do the relationship types mean?</summary>
        ${Object.entries(BUNDLE.relation_definitions||{}).map(([k,v])=>`<div><b>${escapeHtml(k)}</b> — ${escapeHtml(v)}</div>`).join("")}
      </details>
    </div>
    ${done===items.length ? `<div class="done"><h2>All ${items.length} done — thank you!</h2>
        <p style="color:var(--muted)">Click below and email the file back. You can re-download anytime.</p>
        <button class="b-sup" onclick="downloadLabels()">Download labels</button></div>` : ""}
  `;
  enterTs = performance.now();
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Record (once) that the annotator opened the system-reasoning panel for an item, and whether
// they had already answered. Lets the analysis report agreement on the UN-VIEWED subset (clean,
// un-anchored) separately from items where the reasoning was consulted.
function onReasoning(id, el){
  if(!el || !el.open) return;
  const r = responses[id] || (responses[id] = {time_ms:0});
  if(!r.reasoning_viewed){ r.reasoning_viewed = true; r.viewed_with_prior_label = !!r.label; save(); }
}

function downloadLabels(){
  accrue();
  const out = {
    annotator_id: BUNDLE.annotator_id, schema_version: BUNDLE.schema_version||1,
    task: BUNDLE.task || "relationship_validity",
    started_at: startedAt, submitted_at: new Date().toISOString(),
    labels: items.map((it,i)=>({
      id: it.id, source_document: it.source_document, shown_order: it.shown_order??i,
      label: (responses[it.id]&&responses[it.id].label) || null,
      time_ms: (responses[it.id]&&responses[it.id].time_ms) || 0,
      reasoning_viewed: !!(responses[it.id]&&responses[it.id].reasoning_viewed),
      reasoning_viewed_with_prior_label: !!(responses[it.id]&&responses[it.id].viewed_with_prior_label)
    }))
  };
  const blob = new Blob([JSON.stringify(out,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "labels_" + BUNDLE.annotator_id + ".json";
  document.body.appendChild(a); a.click(); a.remove();
}

document.addEventListener("keydown", e=>{
  if(e.key==="f") setLabel("supported");
  else if(e.key==="j") setLabel("not_supported");
  else if(e.key==="s") setLabel("skip");
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="ArrowRight") go(1);
});

render();
</script>
