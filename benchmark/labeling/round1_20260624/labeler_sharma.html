ong, 92 µm thick shank that terminates in grating coupler emitters. It operates over a wide visible wavelength range of 430-645 nm, making it suitable for exciting various opsins. The system's overall first-order transmission is greater than -18 dB.", "reasoning": "The new entity 'end-fire optical phased arrays' is explicitly described as a component 'intended for integration on silicon neural probes'. The candidate entity 'neurophotonic probe' is the architecture for such a device. This establishes a clear relationship where the component is part of the architecture. A new edge type `IS_COMPONENT_OF` is proposed as the inverse of the existing `USES_COMPONENT` to represent this `Component -> Architecture` link.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 0, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1429", "head": "optical scattering", "head_type": "Physical_Principle", "head_description": "Optical scattering is a physical phenomenon that occurs in brain tissue, posing a challenge for delivering light to deep brain regions. This scattering causes beam broadening, which degrades the performance of optical beam steering. The use of light-emitting implants like silicon neural probes is a proposed solution to overcome the limitations imposed by optical scattering.", "relation": "RELATED_TO", "tail": "implantable silicon-based probe", "tail_type": "Architecture", "tail_description": "An implantable, silicon-based device designed to switch and route multiple optical beams for stimulating specific sets of neurons, while simultaneously recording the resulting neural activity. The probe incorporates a nanoscale switching network composed of reconfigurable silicon nitride waveguide structures and co-fabricated electrical recording sites. The technology is scalable and allows for advanced functions like beam focusing, steering, and structured illumination. An eight-beam version was demonstrated to stimulate small groups of neurons in mice with sub-millisecond precision.", "reasoning": "The evidence explicitly states that 'light-emitting implants are needed' as a direct consequence of 'optical scattering in brain tissue'. The 'implantable silicon-based probe' is a specific example of such an implant. The relationship is that the architecture is designed to overcome the limitations imposed by the physical principle. This warrants a new, specific edge type `DESIGNED_TO_OVERCOME`.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 1, "evidence_quotes": ["However, due to optical scattering in brain tissue, light-emitting implants are needed to bring patterned illumination to deep brain regions."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1432", "head": "optical scattering", "head_type": "Physical_Principle", "head_description": "Optical scattering is a physical phenomenon that occurs in brain tissue, posing a challenge for delivering light to deep brain regions. This scattering causes beam broadening, which degrades the performance of optical beam steering. The use of light-emitting implants like silicon neural probes is a proposed solution to overcome the limitations imposed by optical scattering.", "relation": "RELATED_TO", "tail": "out-of-plane focusing grating emitters", "tail_type": "Component", "tail_description": "A specifically designed type of grating emitter that focuses light to a point located above the surface of the neural probe. This capability allows for spatially precise targeting of neurons at a distance. A significant advantage of this design is its ability to achieve the required intensities for optogenetic actuation (~1 mW/mm²) at lower input powers compared to other emitters.", "reasoning": "Similar to the general nanophotonic grating emitter, the 'out-of-plane focusing grating emitters' are components whose design purpose (focusing light for precise targeting) is a direct response to the challenges posed by 'optical scattering' in tissue, such as beam broadening. The evidence links scattering to the need for implants, and these emitters are the functional parts of those implants that deal with light delivery. The proposed edge type `DESIGNED_TO_OVERCOME` applies.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 2, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1430", "head": "optical scattering", "head_type": "Physical_Principle", "head_description": "Optical scattering is a physical phenomenon that occurs in brain tissue, posing a challenge for delivering light to deep brain regions. This scattering causes beam broadening, which degrades the performance of optical beam steering. The use of light-emitting implants like silicon neural probes is a proposed solution to overcome the limitations imposed by optical scattering.", "relation": "RELATED_TO", "tail": "neurophotonic probe", "tail_type": "Architecture", "tail_description": "A proof-of-concept implantable device designed for optogenetic stimulation of rodent brains. The probe is fabricated on a silicon nitride platform and consists of an array of edge couplers, waveguides for routing light, and a 4 mm long, 92 µm thick shank that terminates in grating coupler emitters. It operates over a wide visible wavelength range of 430-645 nm, making it suitable for exciting various opsins. The system's overall first-order transmission is greater than -18 dB.", "reasoning": "The evidence states that 'light-emitting implants are needed' because of 'optical scattering'. The 'neurophotonic probe' is described as an 'implantable device' for optogenetics. Therefore, its design is motivated by the need to overcome the physical principle of optical scattering to deliver light effectively within brain tissue. A new edge type `DESIGNED_TO_OVERCOME` is appropriate.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 3, "evidence_quotes": ["However, due to optical scattering in brain tissue, light-emitting implants are needed to bring patterned illumination to deep brain regions."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1433", "head": "optical scattering", "head_type": "Physical_Principle", "head_description": "Optical scattering is a physical phenomenon that occurs in brain tissue, posing a challenge for delivering light to deep brain regions. This scattering causes beam broadening, which degrades the performance of optical beam steering. The use of light-emitting implants like silicon neural probes is a proposed solution to overcome the limitations imposed by optical scattering.", "relation": "RELATED_TO", "tail": "eight-beam probe", "tail_type": "Architecture", "tail_description": "A specific implementation of the implantable nanophotonic probe, designed with eight independently switchable output beams. This architecture is created by cascading multiple 1x2 Mach-Zehnder interference (MZI) switches to form a 1x8 switching network. The outputs of this network are connected via waveguides to eight distinct grating emitters, allowing for precise, multi-point neural stimulation.", "reasoning": "The evidence directly links the problem of 'optical scattering' in brain tissue to the need for 'light-emitting implants'. The 'eight-beam probe' is a specific architecture for such an implant. Therefore, the probe's existence and design are a direct solution to overcome the challenges presented by the physical principle of optical scattering. The proposed edge type `DESIGNED_TO_OVERCOME` is appropriate.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 4, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1480", "head": "slab-assisted optical phased array", "head_type": "Architecture", "head_description": "An actively-controlled optical phased array (OPA) architecture that uses a free-propagation region (FPR) slab for spatial filtering. This design, fabricated in a 150-nm-thick SiN waveguide layer, circumvents the need for λ/2 emitter spacing to achieve single-lobe steering. The demonstrated device operates at 488 nm and consists of an input splitter tree, 16 phase-controlled waveguides, an FPR slab, and an output grating.", "relation": "HAS_PROPERTY", "tail": "beam broadening", "tail_type": "Property", "tail_description": "Beam broadening is an undesirable effect where the width of the optical beam increases as it propagates. In the context of the paper, it is identified as a key challenge for beam steering performance, particularly in tissue where it is caused by optical scattering. Another potential cause is the laser source linewidth, which is mitigated in the OPA design by ensuring the device's free spectral range (~20 nm) is much wider than the laser linewidth (~1-2 nm).", "reasoning": "The evidence for 'beam broadening' explicitly states: 'This design choice reduces the ratio of our supercontinuum laser source linewidth (~1 - 2nm) to the FSR of the OPA, thereby minimizing beam broadening caused by the linewidth of the laser source.' The 'OPA' in this context is the 'slab-assisted optical phased array'. This directly links the architecture to the property of beam broadening, as the design was made to mitigate this specific undesirable effect. Therefore, the architecture has this property as a key design consideration.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 5, "evidence_quotes": ["While beam steering performance in tissue reveals challenges, including beam broadening from scattering and the need for a wider steering range, this proof-of-concept demonstration illustrates the design principles for realizing compact optical phased arrays capable of continuous single-beam scanning, laying the groundwork for advancing optical phased arrays toward targeted optogenetic stimulation."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1439", "head": "end-fire optical phased arrays", "head_type": "Component", "head_description": "An end-fire optical phased array is a key component of the grating-based light emitters proposed in the paper. It is combined with a slab grating to generate a single steerable beam and suppress sidelobes. This component is part of a compact design intended for integration on silicon neural probes for optogenetic stimulation. In vivo experiments demonstrated that this optical phased array provided sufficient power for its application.", "relation": "RELATED_TO", "tail": "slab-assisted optical phased array", "tail_type": "Architecture", "tail_description": "An actively-controlled optical phased array (OPA) architecture that uses a free-propagation region (FPR) slab for spatial filtering. This design, fabricated in a 150-nm-thick SiN waveguide layer, circumvents the need for λ/2 emitter spacing to achieve single-lobe steering. The demonstrated device operates at 488 nm and consists of an input splitter tree, 16 phase-controlled waveguides, an FPR slab, and an output grating.", "reasoning": "The new entity 'end-fire optical phased arrays' is described as a 'key component' that is 'combined with a slab grating'. The candidate entity 'slab-assisted optical phased array' is an 'architecture' that uses a slab for filtering. This indicates that the component is part of the overall architecture. Since the existing `USES_COMPONENT` edge is for `Architecture -> Component`, a new inverse edge `IS_COMPONENT_OF` is proposed for the `Component -> Architecture` relationship.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 6, "evidence_quotes": ["The light emitters, optimized for blue or amber light, combine end-ﬁre optical phased arrays with slab gratings to suppress higher-order sidelobes."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1547", "head": "end-fire waveguide array", "head_type": "Architecture", "head_description": "An array of waveguides that emits light from its ends (in-plane) to form a steerable beam. In this device, the array is thermo-optically tuned to control the emission angle (θ_FPR) of its primary lobe. This lobe is then launched into a free-propagation region slab for spatial filtering. The size of the end-fire array was the limiting factor for the number of resolvable spots in the OPA.", "relation": "HAS_PROPERTY", "tail": "propagation constant", "tail_type": "Property", "tail_description": "The propagation constant is a parameter that describes how a wave propagates through a medium. In the context of the OPA's phase-matching condition, β represents the propagation constant of the in-plane emission within the waveguide, and k represents the propagation constant of the output beam in the surrounding medium.", "reasoning": "An end-fire waveguide array is an architecture composed of multiple waveguides. The light traveling within these waveguides is characterized by a propagation constant, which is a fundamental parameter determining the array's emission properties.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 7, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1526", "head": "curved grating", "head_type": "Component", "head_description": "A curved grating is a type of slab grating used in some of the OPA designs (OPA I and III). A free-propagation region (FPR) is introduced as a transition section between the end-fire phased array and the curved grating. The curvature of the grating is a factor in one of the two mechanisms for beam steering, where the out-of-plane emission angle depends on the incident angle of the beam on the grating.", "relation": "RELATED_TO", "tail": "binary splitter tree", "tail_type": "Architecture", "tail_description": "An optical power distribution network at the input of the OPA. It is constructed from 1x2 multimode interferometers (MMIs) and is designed to split the incoming light evenly into the 16 separate waveguides that form the phased array.", "reasoning": "The 'curved grating' is described as a component used in OPA designs. The 'binary splitter tree' is described as an optical power distribution network at the input of an OPA. Since both are components or sub-systems within the same larger architecture (an OPA), they are related.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 8, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1535", "head": "slab grating emitter", "head_type": "Component", "head_description": "A component of the optical phased array that receives the steered beam from the end-fire waveguide array and emits it out of the chip. It is composed of a free-propagation region (FPR) slab followed by a grating. The FPR slab acts as a spatial filter to clip unwanted lobes, enabling single-lobe emission, while the grating couples the primary lobe out of the plane.", "relation": "HAS_PROPERTY", "tail": "out-of-plane emission angles", "tail_type": "Property", "tail_description": "The out-of-plane emission angles, denoted as (θ, φ), define the direction of the final output beam radiated by the grating into free space. These angles are determined by the in-plane propagation angle (φ_in) according to the phase-matching condition of the grating.", "reasoning": "The 'slab grating emitter' is described as the component that emits a beam out of the chip via a grating. The 'out-of-plane emission angles' are explicitly defined as the property describing the direction of the beam radiated by the grating. Therefore, the slab grating emitter has this property.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 9, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1517", "head": "Slab Curvature", "head_type": "Property", "head_description": "Slab curvature is a design parameter for the slab grating component of the optical phased arrays. Different curvatures were investigated to study their effect on performance. The designs included concave (OPA I), straight (OPA II, IV), and convex (OPA III) curvatures.", "relation": "RELATED_TO", "tail": "planar waveguide", "tail_type": "Component", "tail_description": "A fundamental component of the silicon nitride (Si3N4) photonic platform, enabling the creation of integrated devices and system-on-chip solutions. These waveguides are characterized by their low propagation loss (<1 dB/m), a wide transparency window (400–2350 nm), and the ability to handle high optical power. They can be engineered to perform various linear and nonlinear optical functions and serve as the basis for passive and active building blocks.", "reasoning": "The new entity 'Slab Curvature' is described as a property of a 'slab grating component'. A slab grating is a structure fundamentally composed of planar waveguides. Therefore, 'Slab Curvature' is a geometric property that can be possessed by a structure made from the 'planar waveguide' component.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 10, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1416", "head": "nanophotonic phased array (nanoantenna phased array)", "head_type": "Architecture", "head_description": "A large-scale, two-dimensional array of optical nanoantennas integrated on a silicon chip, designed to generate and control far-field radiation patterns. The device consists of a power distribution network that uniformly excites all antenna elements. The paper demonstrates a passive 64x64 version with 4,096 elements within a 576 µm x 576 µm footprint, and an active 8x8 version capable of dynamic beam steering and shaping via phase tuning.", "relation": "HAS_PROPERTY", "tail": "free spectral range", "tail_type": "Property", "tail_description": "In an optical phased array (OPA) based on delay lines, the free spectral range (FSR) is determined by the differential path length between the delay lines. Designing for a wide FSR can be a strategy to minimize beam broadening that arises from the linewidth of the laser source.", "reasoning": "The new entity 'free spectral range' is described as a property of an Optical Phased Array (OPA) based on delay lines. The candidate entity, 'nanophotonic phased array', is a type of OPA, and its description explicitly mentions an 'active 8x8 version capable of dynamic beam steering and shaping via phase tuning,' which implies the use of delay lines. Therefore, this architecture has the property of a free spectral range.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 11, "evidence_quotes": ["The delay lines had a differential path length of 5–6 μm to realize OPAs with a wide free spectral range (FSR) of ~ 20 nm."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1476", "head": "optical phased array", "head_type": "Architecture", "head_description": "The optical phased array (OPA) is a passive nanophotonic circuit designed for sidelobe-free beam steering on implantable neural probes. The architecture consists of an input waveguide that feeds a star coupler, which splits the light into 16 delay line waveguides. These delay lines, which have a differential path length to create a wide free spectral range, converge to form an end-fire phased array. The beam formed by interference in the phased array is then radiated out of the device plane by a slab grating. The OPA demonstrated sufficient power for optogenetic stimulation in vivo.", "relation": "BASED_ON_PRINCIPLE", "tail": "Interference", "tail_type": "Physical_Principle", "tail_description": "Interference is a fundamental physical principle describing the combination of waves, where the resulting optical field profile is determined by the phases of the individual waves. This core phenomenon is exploited across silicon photonics design, forming the operating basis for several key components and architectures. Examples include: Mach–Zehnder Interferometers (MZI), where output intensity is a function of the phase difference (Δϕ) between arms; Multimode Interference (MMI) devices, where the optical field evolves through the interference of multiple propagating supermodes; and Bragg_Reflection in gratings, which relies on the constructive interference of distributed reflections for Wavelength_Filter functionality. In nanophotonic phased arrays (NPAs), interference between the emissions from multiple optical antennas is used to form a desired far-field radiation pattern. In certain phased array architectures, interference can occur primarily on-chip to form a guided beam, which is then subsequently radiated out-of-plane by a separate component like a slab grating. Furthermore, in programmable Photonic Integrated Circuits (PICs), interference within meshes of connected waveguides is controlled to implement various linear functions and programmable wavelength filters. When scaled, these interference-based meshes can perform complex linear optical computations, such as real-time matrix-vector products.", "reasoning": "The new entity description and evidence quotes explicitly state that the optical phased array operates based on the principle of interference. The quote \"The interference of the phased array emission to steer the beam primarily occurred within the chip\" directly links the architecture to this physical principle.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 12, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1491", "head": "star coupler", "head_type": "Component", "head_description": "A star coupler is a passive photonic component used within the optical phased array (OPA) architecture. Its function is to act as a power splitter, dividing the incoming light from a single input waveguide and distributing it among multiple output waveguides. In this specific design, the star coupler splits the light into 16 delay line waveguides.", "relation": "PERFORMS_FUNCTION", "tail": "Power Splitter", "tail_type": "Design_Function", "tail_description": "The Power Splitter is a fundamental design function used to split light from one waveguide equally into two waveguides (splitter), or to combine light from two waveguides into one (combiner). This capability is critical for constructing photonic integrated circuits, particularly in devices like the Mach–Zehnder interferometer. When operating as a splitter, an input intensity (Ii) is split equally such that each output has intensity I1 = I2 = Ii /2, and the device functions as a 50/50% beam-splitter in both the splitting and combining directions. Power splitters are implemented using fundamental components such as the Y-Branch and the Directional Coupler.", "reasoning": "The evidence for 'star coupler' explicitly states that it 'divided the light from an input waveguide into 16 delay line waveguides'. This is a direct description of the 'Power Splitter' design function, which is 'used to split light from one waveguide'. The star coupler is a component that performs the function of power splitting.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 13, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1561", "head": "slab-assisted optical phased array", "head_type": "Architecture", "head_description": "An actively-controlled optical phased array (OPA) architecture that uses a free-propagation region (FPR) slab for spatial filtering. This design, fabricated in a 150-nm-thick SiN waveguide layer, circumvents the need for λ/2 emitter spacing to achieve single-lobe steering. The demonstrated device operates at 488 nm and consists of an input splitter tree, 16 phase-controlled waveguides, an FPR slab, and an output grating.", "relation": "HAS_PROPERTY", "tail": "Device Size", "tail_type": "Property", "tail_description": "The device size is the physical footprint of the optical phased array (OPA) on the chip, measured in square millimeters. The four OPA designs presented have compact footprints, with OPA IV being the smallest at 0.006 mm² and OPA I being the largest at 0.018 mm².", "reasoning": "The new entity 'Device Size' is defined as the physical footprint of an optical phased array (OPA). The candidate entity 'slab-assisted optical phased array' is explicitly described as an 'OPA architecture'. Therefore, the architecture has the property of having a device size. The evidence quote supports this by listing device sizes for various 'OPA designs'.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 14, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1095", "head": "neurophotonic probe", "head_type": "Architecture", "head_description": "A proof-of-concept implantable device designed for optogenetic stimulation of rodent brains. The probe is fabricated on a silicon nitride platform and consists of an array of edge couplers, waveguides for routing light, and a 4 mm long, 92 µm thick shank that terminates in grating coupler emitters. It operates over a wide visible wavelength range of 430-645 nm, making it suitable for exciting various opsins. The system's overall first-order transmission is greater than -18 dB.", "relation": "PERFORMS_FUNCTION", "tail": "optogenetic stimulation", "tail_type": "Design_Function", "tail_description": "A primary application of implantable neural probes, which deliver light of specific wavelengths to activate or inhibit genetically modified neurons. For targeted neural stimulation, patterned illumination is crucial. The delivered wavelength is tailored to match the excitation spectra of the light-sensitive proteins (opsins) expressed by the neurons. Due to optical scattering in brain tissue, light-emitting implants are necessary to deliver patterned light to deep brain regions. The probes deliver sufficient light intensities for this purpose, and the function can operate concurrently with electrophysiology recording or be used with fluorophores for imaging. It is a technique commonly applied in animal models, such as rodent brains.", "reasoning": "The description for the 'neurophotonic probe' explicitly states that it is a 'proof-of-concept implantable device designed for optogenetic stimulation of rodent brains'. This is a direct and unambiguous statement that the architecture performs the specified design function.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 15, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1444", "head": "implantable silicon-based probe", "head_type": "Architecture", "head_description": "An implantable, silicon-based device designed to switch and route multiple optical beams for stimulating specific sets of neurons, while simultaneously recording the resulting neural activity. The probe incorporates a nanoscale switching network composed of reconfigurable silicon nitride waveguide structures and co-fabricated electrical recording sites. The technology is scalable and allows for advanced functions like beam focusing, steering, and structured illumination. An eight-beam version was demonstrated to stimulate small groups of neurons in mice with sub-millisecond precision.", "relation": "USES_COMPONENT", "tail": "end-fire optical phased arrays", "tail_type": "Component", "tail_description": "An end-fire optical phased array is a key component of the grating-based light emitters proposed in the paper. It is combined with a slab grating to generate a single steerable beam and suppress sidelobes. This component is part of a compact design intended for integration on silicon neural probes for optogenetic stimulation. In vivo experiments demonstrated that this optical phased array provided sufficient power for its application.", "reasoning": "The new entity description for 'end-fire optical phased arrays' explicitly states it is a component 'intended for integration on silicon neural probes for optogenetic stimulation'. This directly supports the relationship that the 'implantable silicon-based probe' (Architecture) uses the 'end-fire optical phased arrays' (Component).", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 16, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1443", "head": "end-fire optical phased arrays", "head_type": "Component", "head_description": "An end-fire optical phased array is a key component of the grating-based light emitters proposed in the paper. It is combined with a slab grating to generate a single steerable beam and suppress sidelobes. This component is part of a compact design intended for integration on silicon neural probes for optogenetic stimulation. In vivo experiments demonstrated that this optical phased array provided sufficient power for its application.", "relation": "RELATED_TO", "tail": "grating lobes", "tail_type": "Property", "tail_description": "Undesirable secondary beams in the far-field radiation pattern of a phased array, which can reduce the power and quality of the main beam. The presented OPA architecture is designed to suppress these lobes. Simulations show that scaled versions of the device can maintain 10-20 dB of suppression of unwanted grating lobes.", "reasoning": "The new entity, 'end-fire optical phased arrays', is designed to 'suppress sidelobes', which are a form of 'grating lobes' (the candidate entity). The component's function is to mitigate this property. This relationship does not fit `HAS_PROPERTY` (as suppression is the goal, not possession) or `PERFORMS_FUNCTION` (which would link to the action of suppression, not the property itself). Therefore, `RELATED_TO` is the most appropriate edge type to capture that the component is designed to act upon this property.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 17, "evidence_quotes": ["The light emitters, optimized for blue or amber light, combine end-ﬁre optical phased arrays with slab gratings to suppress higher-order sidelobes."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1407", "head": "beam steering", "head_type": "Design_Function", "head_description": "The fundamental operation of an optical phased array (OPA), where the direction of an emitted light beam is controlled. This is achieved by adjusting the relative optical phase across an array of discrete emitters to create constructive interference in a desired direction and destructive interference elsewhere. This method allows for fast and robust beam steering within a monolithic, chip-scale device. Beam steering can be implemented by combining an in-plane phased array with a light-emitting grating, which enables single-lobe steering even when the emitter pitch does not meet the half-wavelength criterion. In architectures that include a Free-Propagation Region (FPR) between the phased array and the out-coupling grating, steering is achieved through a combination of two mechanisms: the lateral translation of the beam within the FPR, and the angle-dependent out-of-plane emission from the grating.", "relation": "RELATED_TO", "tail": "waveguides", "tail_type": "Component", "tail_description": "On-chip waveguides are fundamental building blocks of programmable photonic integrated circuits that guide the flow of light. They are commonly included as standard components, often represented as parametric cells (PCells), in photonic design kits (PDKs). In circuit design, they are connected in a mesh topology, linking other components such as tunable beam couplers and 2x2 optical gates. During the layout phase, specialized routing algorithms like river routers are employed to connect groups of parallel waveguides without allowing them to cross. By interfering signals along different paths defined by the waveguide mesh, various linear functions and optical computations can be performed.", "reasoning": "The description of 'beam steering' mentions its implementation in a 'photonic circuit architecture' that includes an 'in-plane phased array'. An integrated in-plane phased array is fundamentally composed of waveguides that guide light and apply phase shifts. Therefore, the function of beam steering in this context is intrinsically dependent on the use of waveguides, making them directly related.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 18, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1465", "head": "optical phased array", "head_type": "Architecture", "head_description": "The optical phased array (OPA) is a passive nanophotonic circuit designed for sidelobe-free beam steering on implantable neural probes. The architecture consists of an input waveguide that feeds a star coupler, which splits the light into 16 delay line waveguides. These delay lines, which have a differential path length to create a wide free spectral range, converge to form an end-fire phased array. The beam formed by interference in the phased array is then radiated out of the device plane by a slab grating. The OPA demonstrated sufficient power for optogenetic stimulation in vivo.", "relation": "PERFORMS_FUNCTION", "tail": "beam steering", "tail_type": "Design_Function", "tail_description": "The fundamental operation of an optical phased array (OPA), where the direction of an emitted light beam is controlled. This is achieved by adjusting the relative optical phase across an array of discrete emitters to create constructive interference in a desired direction and destructive interference elsewhere. This method allows for fast and robust beam steering within a monolithic, chip-scale device. Beam steering can be implemented by combining an in-plane phased array with a light-emitting grating, which enables single-lobe steering even when the emitter pitch does not meet the half-wavelength criterion. In architectures that include a Free-Propagation Region (FPR) between the phased array and the out-coupling grating, steering is achieved through a combination of two mechanisms: the lateral translation of the beam within the FPR, and the angle-dependent out-of-plane emission from the grating.", "reasoning": "The new entity description explicitly states the 'optical phased array (OPA)' is 'designed for sidelobe-free beam steering'. The candidate entity description defines 'beam steering' as 'The fundamental operation of an optical phased array'. The evidence is direct and confirmatory.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 19, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1405", "head": "beam steering", "head_type": "Design_Function", "head_description": "The fundamental operation of an optical phased array (OPA), where the direction of an emitted light beam is controlled. This is achieved by adjusting the relative optical phase across an array of discrete emitters to create constructive interference in a desired direction and destructive interference elsewhere. This method allows for fast and robust beam steering within a monolithic, chip-scale device. Beam steering can be implemented by combining an in-plane phased array with a light-emitting grating, which enables single-lobe steering even when the emitter pitch does not meet the half-wavelength criterion. In architectures that include a Free-Propagation Region (FPR) between the phased array and the out-coupling grating, steering is achieved through a combination of two mechanisms: the lateral translation of the beam within the FPR, and the angle-dependent out-of-plane emission from the grating.", "relation": "RELATED_TO", "tail": "optical phase shifters", "tail_type": "Component", "tail_description": "Optical phase shifters are fundamental building blocks in programmable photonic circuits, used alongside waveguides and couplers to form analogue optical gates. They are key components within 2x2 optical gates, such as Mach-Zehnder interferometers (MZIs), where they are used to independently control power splitting and relative phase delay. By adjusting the phase, these components enable the programmability of the photonic circuit for applications like linear matrix operations and quantum information processing.", "reasoning": "The new entity 'beam steering' is described as being 'achieved by adjusting the relative optical phase'. The candidate entity 'optical phase shifters' is a component that is used to 'control... relative phase delay'. While a single phase shifter does not perform beam steering on its own, it is a fundamental enabling component for the function. Since the component does not perform the function itself, but is intrinsically linked to how the function is achieved, 'RELATED_TO' is the most appropriate relationship.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 20, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1544", "head": "electro-optic phase shifter", "head_type": "Component", "head_description": "There is not enough information in the provided evidence context to write a detailed description for this entity.", "relation": "HAS_PROPERTY", "tail": "propagation constant", "tail_type": "Property", "tail_description": "The propagation constant is a parameter that describes how a wave propagates through a medium. In the context of the OPA's phase-matching condition, β represents the propagation constant of the in-plane emission within the waveguide, and k represents the propagation constant of the output beam in the surrounding medium.", "reasoning": "An electro-optic phase shifter is a component, typically based on a waveguide, that functions by modulating the material's refractive index. This directly alters the propagation constant of the light passing through it. Therefore, the propagation constant is a key property of this component.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 21, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1541", "head": "SiN waveguides", "head_type": "Component", "head_description": "Flagged: MetricConflict:propagation loss", "relation": "HAS_PROPERTY", "tail": "propagation constant", "tail_type": "Property", "tail_description": "The propagation constant is a parameter that describes how a wave propagates through a medium. In the context of the OPA's phase-matching condition, β represents the propagation constant of the in-plane emission within the waveguide, and k represents the propagation constant of the output beam in the surrounding medium.", "reasoning": "The evidence defines β as the \"propagation constant of the in-plane emission\". This emission occurs within a waveguide. Since SiN waveguides are a specific type of waveguide, they inherently possess a propagation constant as a fundamental physical property.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 22, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1490", "head": "star coupler", "head_type": "Component", "head_description": "A star coupler is a passive photonic component used within the optical phased array (OPA) architecture. Its function is to act as a power splitter, dividing the incoming light from a single input waveguide and distributing it among multiple output waveguides. In this specific design, the star coupler splits the light into 16 delay line waveguides.", "relation": "RELATED_TO", "tail": "binary splitter tree", "tail_type": "Architecture", "tail_description": "An optical power distribution network at the input of the OPA. It is constructed from 1x2 multimode interferometers (MMIs) and is designed to split the incoming light evenly into the 16 separate waveguides that form the phased array.", "reasoning": "Both the 'star coupler' and the 'binary splitter tree' are described as components/architectures that perform the same function of splitting light from a single input into 16 outputs for an optical phased array. They represent alternative methods for achieving the same power distribution goal. Therefore, a 'RELATED_TO' relationship is appropriate as they are functionally equivalent alternatives.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 23, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1437", "head": "optical scattering", "head_type": "Physical_Principle", "head_description": "Optical scattering is a physical phenomenon that occurs in brain tissue, posing a challenge for delivering light to deep brain regions. This scattering causes beam broadening, which degrades the performance of optical beam steering. The use of light-emitting implants like silicon neural probes is a proposed solution to overcome the limitations imposed by optical scattering.", "relation": "RELATED_TO", "tail": "grating-based optical nanoantenna", "tail_type": "Component", "tail_description": "A compact optical antenna with dimensions of 3.0 µm in length, 2.8 µm in width, and 0.22 µm in thickness. The structure consists of five grating teeth. To enhance upward emission, a partial etch of 0.11 µm depth is applied to the first grating groove, which breaks the up-down symmetry of the device.", "reasoning": "The new entity 'optical scattering' is a phenomenon that degrades beam steering performance. The candidate entity 'grating-based optical nanoantenna' is a component used as an emitter, often in phased arrays which perform beam steering. The performance of a system using this component for beam steering in tissue would be directly affected by optical scattering, establishing a clear relationship.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 24, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1532", "head": "grating-based optical nanoantenna", "head_type": "Component", "head_description": "A compact optical antenna with dimensions of 3.0 µm in length, 2.8 µm in width, and 0.22 µm in thickness. The structure consists of five grating teeth. To enhance upward emission, a partial etch of 0.11 µm depth is applied to the first grating groove, which breaks the up-down symmetry of the device.", "relation": "HAS_PROPERTY", "tail": "device footprint", "tail_type": "Property", "tail_description": "Device footprint refers to the physical area occupied by the optical phased array on the chip. Minimizing the footprint is a design goal for creating compact devices. For instance, OPA II was designed with a reduced device footprint by eliminating the free-propagation region (FPR) and directly coupling the end-fire phased array to a straight slab grating.", "reasoning": "The relationship is clearly entailed by the entity descriptions. The new entity is the property 'device footprint'. The candidate entity 'grating-based optical nanoantenna' is a Component whose description explicitly provides its physical dimensions ('3.0 µm in length, 2.8 µm in width'). These dimensions define its footprint. Therefore, the component has this property.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 25, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1401", "head": "operating wavelength", "head_type": "Property", "head_description": "The operating wavelength (λ) is the range of light wavelengths for which the optical phased arrays are designed. The paper details four OPA designs, some for the blue wavelength range (e.g., 460–484 nm for OPA I) and one for the amber range (574–598 nm for OPA IV). The specific wavelength within this range is tuned to control the beam's emission angle.", "relation": "RELATED_TO", "tail": "in-plane emission angle", "tail_type": "Property", "tail_description": "The in-plane emission angle is the angle at which the beam from the end-fire phased array propagates within the plane of the chip. This angle is controlled by tuning the input wavelength of the light source. The change in the in-plane emission angle is the mechanism that steers the final out-of-plane beam.", "reasoning": "The quote 'The input wavelength to the device tuned the in-plane emission angle...' shows a direct relationship where changing one property (wavelength) directly affects another (in-plane angle).", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 26, "evidence_quotes": ["The input wavelength to the device tuned the in-plane emission angle, which also steered the out-of-plane beam."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1482", "head": "beam broadening", "head_type": "Property", "head_description": "Beam broadening is an undesirable effect where the width of the optical beam increases as it propagates. In the context of the paper, it is identified as a key challenge for beam steering performance, particularly in tissue where it is caused by optical scattering. Another potential cause is the laser source linewidth, which is mitigated in the OPA design by ensuring the device's free spectral range (~20 nm) is much wider than the laser linewidth (~1-2 nm).", "relation": "RELATED_TO", "tail": "hybrid laser", "tail_type": "Architecture", "tail_description": "A compact laser architecture created by combining different material platforms. One demonstrated version consists of an Indium Phosphide (InP) gain block coupled to a high-Q Si3N4 microring resonator (MRR), which functions as an external laser mirror. This configuration achieved an integral linewidth of 13 kHz. A variation of this design incorporates a long photon lifetime Si3N4 MRR as a tuning section, resulting in a tunable wavelength output and a fundamental linewidth of less than 300 Hz.", "reasoning": "The evidence for 'beam broadening' explicitly states that one cause is the 'linewidth of the laser source'. The 'hybrid laser' is an architecture specifically designed to achieve a very narrow linewidth. Therefore, a 'hybrid laser' is an architecture that can be used to mitigate the effect of 'beam broadening', establishing a strong relationship.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 27, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1396", "head": "grating-based light emitters", "head_type": "Architecture", "head_description": "Grating-based light emitters are integrated nanophotonic circuits on silicon neural probes designed to generate a single, steerable beam for optogenetic stimulation. These emitters are optimized for blue or amber light. The core architecture combines end-fire optical phased arrays with slab gratings, a configuration that serves to suppress higher-order sidelobes and achieve continuous single-beam scanning.", "relation": "USES_COMPONENT", "tail": "end-fire optical phased arrays", "tail_type": "Component", "tail_description": "An end-fire optical phased array is a key component of the grating-based light emitters proposed in the paper. It is combined with a slab grating to generate a single steerable beam and suppress sidelobes. This component is part of a compact design intended for integration on silicon neural probes for optogenetic stimulation. In vivo experiments demonstrated that this optical phased array provided sufficient power for its application.", "reasoning": "The quote 'The light emitters... combine end-fire optical phased arrays with slab gratings...' shows that the 'grating-based light emitters' architecture incorporates 'end-fire optical phased arrays' as a key component.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 28, "evidence_quotes": ["Here we propose neural probes with grating-based light emitters that generate a single steerable beam.", "The light emitters, optimized for blue or amber light, combine end-ﬁre optical phased arrays with slab gratings to suppress higher-order sidelobes."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1436", "head": "optical scattering", "head_type": "Physical_Principle", "head_description": "Optical scattering is a physical phenomenon that occurs in brain tissue, posing a challenge for delivering light to deep brain regions. This scattering causes beam broadening, which degrades the performance of optical beam steering. The use of light-emitting implants like silicon neural probes is a proposed solution to overcome the limitations imposed by optical scattering.", "relation": "RELATED_TO", "tail": "nanophotonic phased array (nanoantenna phased array)", "tail_type": "Architecture", "tail_description": "A large-scale, two-dimensional array of optical nanoantennas integrated on a silicon chip, designed to generate and control far-field radiation patterns. The device consists of a power distribution network that uniformly excites all antenna elements. The paper demonstrates a passive 64x64 version with 4,096 elements within a 576 µm x 576 µm footprint, and an active 8x8 version capable of dynamic beam steering and shaping via phase tuning.", "reasoning": "The new entity 'optical scattering' is described as a challenge that 'degrades the performance of optical beam steering'. The candidate entity 'nanophotonic phased array' is an architecture explicitly described as being 'capable of dynamic beam steering'. Therefore, optical scattering is a physical phenomenon that directly impacts the function and performance of this architecture.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 29, "evidence_quotes": ["While beam steering performance in tissue reveals challenges, including beam broadening from scattering and the need for a wider steering range, this proof-of-concept demonstration illustrates the design principles for realizing compact optical phased arrays capable of continuous single-beam scanning, laying the groundwork for advancing optical phased arrays toward targeted optogenetic stimulation."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1449", "head": "grating-based light emitters", "head_type": "Architecture", "head_description": "Grating-based light emitters are integrated nanophotonic circuits on silicon neural probes designed to generate a single, steerable beam for optogenetic stimulation. These emitters are optimized for blue or amber light. The core architecture combines end-fire optical phased arrays with slab gratings, a configuration that serves to suppress higher-order sidelobes and achieve continuous single-beam scanning.", "relation": "RELATED_TO", "tail": "nanophotonic grating emitters", "tail_type": "Component", "tail_description": "Optical components integrated into implantable silicon neural probes, designed to focus emitted light for precise optogenetic targeting of neurons. The gratings are designed using the holographic principle for specific operational wavelengths, such as 488 nm and 594 nm, to match the excitation spectra of common optogenetic actuators. The measured optical emission pattern of these emitters has shown good agreement with simulations in both non-scattering media and tissue.", "reasoning": "The new entity 'grating-based light emitters' is described as an architecture for integrated nanophotonic circuits on neural probes. The candidate entity 'nanophotonic grating emitters' is described as a general component type integrated into the same type of probes. The names and descriptions are highly similar, indicating they are closely related concepts, with the new entity being a specific architectural implementation of the general component concept.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 30, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1515", "head": "slab grating emitter", "head_type": "Component", "head_description": "A component of the optical phased array that receives the steered beam from the end-fire waveguide array and emits it out of the chip. It is composed of a free-propagation region (FPR) slab followed by a grating. The FPR slab acts as a spatial filter to clip unwanted lobes, enabling single-lobe emission, while the grating couples the primary lobe out of the plane.", "relation": "HAS_PROPERTY", "tail": "Slab Curvature", "tail_type": "Property", "tail_description": "Slab curvature is a design parameter for the slab grating component of the optical phased arrays. Different curvatures were investigated to study their effect on performance. The designs included concave (OPA I), straight (OPA II, IV), and convex (OPA III) curvatures.", "reasoning": "The new entity 'Slab Curvature' is explicitly described as a 'design parameter for the slab grating component'. The candidate entity 'slab grating emitter' is described as being 'composed of a free-propagation region (FPR) slab followed by a grating'. Therefore, the slab grating emitter is the component that possesses the property of slab curvature.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 31, "evidence_quotes": ["where Γ depends on the curvature of the slab grating."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1435", "head": "optical scattering", "head_type": "Physical_Principle", "head_description": "Optical scattering is a physical phenomenon that occurs in brain tissue, posing a challenge for delivering light to deep brain regions. This scattering causes beam broadening, which degrades the performance of optical beam steering. The use of light-emitting implants like silicon neural probes is a proposed solution to overcome the limitations imposed by optical scattering.", "relation": "RELATED_TO", "tail": "end-fire waveguide array", "tail_type": "Architecture", "tail_description": "An array of waveguides that emits light from its ends (in-plane) to form a steerable beam. In this device, the array is thermo-optically tuned to control the emission angle (θ_FPR) of its primary lobe. This lobe is then launched into a free-propagation region slab for spatial filtering. The size of the end-fire array was the limiting factor for the number of resolvable spots in the OPA.", "reasoning": "The new entity 'optical scattering' is described as a phenomenon that degrades beam steering performance. The candidate entity 'end-fire waveguide array' is an architecture that 'emits light from its ends (in-plane) to form a steerable beam'. Since this architecture is used for beam steering, its performance is directly impacted by the physical principle of optical scattering in the target medium (e.g., brain tissue).", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 32, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1413", "head": "slab-assisted optical phased array", "head_type": "Architecture", "head_description": "An actively-controlled optical phased array (OPA) architecture that uses a free-propagation region (FPR) slab for spatial filtering. This design, fabricated in a 150-nm-thick SiN waveguide layer, circumvents the need for λ/2 emitter spacing to achieve single-lobe steering. The demonstrated device operates at 488 nm and consists of an input splitter tree, 16 phase-controlled waveguides, an FPR slab, and an output grating.", "relation": "HAS_PROPERTY", "tail": "free spectral range", "tail_type": "Property", "tail_description": "In an optical phased array (OPA) based on delay lines, the free spectral range (FSR) is determined by the differential path length between the delay lines. Designing for a wide FSR can be a strategy to minimize beam broadening that arises from the linewidth of the laser source.", "reasoning": "The new entity 'free spectral range' is described as a property of an Optical Phased Array (OPA). The evidence quotes explicitly state, 'to realize OPAs with a wide free spectral range (FSR)'. The candidate entity, 'slab-assisted optical phased array', is a specific type of OPA. Therefore, the slab-assisted OPA has the property of a free spectral range.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 33, "evidence_quotes": ["The delay lines had a differential path length of 5–6 μm to realize OPAs with a wide free spectral range (FSR) of ~ 20 nm."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1399", "head": "beam broadening", "head_type": "Property", "head_description": "Beam broadening is an undesirable effect where the width of the optical beam increases as it propagates. In the context of the paper, it is identified as a key challenge for beam steering performance, particularly in tissue where it is caused by optical scattering. Another potential cause is the laser source linewidth, which is mitigated in the OPA design by ensuring the device's free spectral range (~20 nm) is much wider than the laser linewidth (~1-2 nm).", "relation": "RELATED_TO", "tail": "optical scattering", "tail_type": "Physical_Principle", "tail_description": "Optical scattering is a physical phenomenon that occurs in brain tissue, posing a challenge for delivering light to deep brain regions. This scattering causes beam broadening, which degrades the performance of optical beam steering. The use of light-emitting implants like silicon neural probes is a proposed solution to overcome the limitations imposed by optical scattering.", "re e, multi-point neural stimulation.", "reasoning": "The new entity 'microelectrodes' is described as a component integrated into 'the neural probe platform'. The candidate entity 'eight-beam probe' is a specific architecture for such a probe. Therefore, the microelectrodes are a component part of this architecture. Proposing a new edge type 'IS_PART_OF' (Component -> Architecture) as this is a fundamental part-whole relationship not covered by the existing schema, where USES_COMPONENT has the inverse direction.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 35, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1527", "head": "device footprint", "head_type": "Property", "head_description": "Device footprint refers to the physical area occupied by the optical phased array on the chip. Minimizing the footprint is a design goal for creating compact devices. For instance, OPA II was designed with a reduced device footprint by eliminating the free-propagation region (FPR) and directly coupling the end-fire phased array to a straight slab grating.", "relation": "RELATED_TO", "tail": "slab-assisted optical phased array", "tail_type": "Architecture", "tail_description": "An actively-controlled optical phased array (OPA) architecture that uses a free-propagation region (FPR) slab for spatial filtering. This design, fabricated in a 150-nm-thick SiN waveguide layer, circumvents the need for λ/2 emitter spacing to achieve single-lobe steering. The demonstrated device operates at 488 nm and consists of an input splitter tree, 16 phase-controlled waveguides, an FPR slab, and an output grating.", "reasoning": "The evidence for 'device footprint' explicitly links it to the design of an 'OPA II', stating a goal was a 'reduced device footprint'. The candidate entity, 'slab-assisted optical phased array', is a type of OPA architecture. An architecture inherently has a physical footprint. Therefore, the property 'device footprint' is directly related to the 'slab-assisted optical phased array' architecture. The correct edge type would be HAS_PROPERTY from the architecture to the property.", "source_document": "08_Sharma_phasedarray_neuralprobe_CommEng2024", "shown_order": 36, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:1460", "head": "grating-based light emitters", "head_type": "Architecture", "head_description": "Grating-based light emitters are integrated nanophotonic circuits on silicon neural probes designed to generate a single, steerable beam for optogenetic stimulation. These emitters are optimized for blue or amber light. The core architecture combines end-fire optical phased arrays with slab gratings, a configuration that serves to suppress higher-order sidelobes and achieve continuous single-beam scanning.", "relation": "RELATED_TO", "tail": "wavelengths", "tail_type": "Property", "tail_description": "SECTION BLOCKS (full blocks where entity appears):\n[LLM Analysis]\nReason: LLM response (JSON parsing failed)\n\njson\n[\n    {\n        \"text\": \"Here, we report the first waveguide-coupled Si SPAD. The device is monolithically integrated in a Si photonic platform and operates in the visible spectrum. The device exhibited a single photon detection efficiency of >6% for wavelengths of 488 and 532 nm with an excess voltage of <20% of the breakdown voltage. The dark count rate was below 100 kHz at room temperature, with the possibility of improving by approximately 35% by reducing the temperature to -5 °C.\",\n        \"section_type\": \"Abstract\",\n        \"reason\": \"This section introduces the novel component (waveguide-coupled Si SPAD), its architecture (monolithically integrated in Si), its design function (single-photon detection in the visible spectrum), and key performance metrics (photon detection efficiency, dark count rate).\"\n    },\n    {\n        \"text\": \"In this work, we report, to the best of our knowledge, the first waveguide-coupled Si SPAD. The device is suitable for the detection of VIS light. The preliminary results of the device were reported in ref. [29]. The device was monolithically integrated within a Si photonics platform, featuring various photonic components such as low-loss VIS spectrum waveguides[30], edge couplers[31], thermo-optic phase shifters[32], and electrothermally actuated micro-electromechanical systems (MEMS) cantilever beam scanners[33]. We have previously reported its linear mode operation in ref. [34]. Here, we extend our work to demonstrate single-photon (Geiger-mode) operation. We characterize the photon detection efficiency and dark count rate at room temperature. This work opens the path toward the integration of single-photon detectors in very large-scale integrated photonic circuits operating near room temperature[16-18,35-39].\",\n        \"section_type\": \"Introduction\",\n        \"reason\": \"This paragraph explicitly states the paper's contribution: the first waveguide-coupled Si SPAD. It describes the proposed architecture, including the integration platform and other available components (waveguides, couplers, phase shifters), and its primary design function (single-photon detection).\"\n    },\n    {\n        \"text\": \"Figure 1a shows a schematic of the cross-section of the waveguide-coupled Si SPAD. Details of the device geometry are reported in ref.  $^{34}$ . The structure is composed of a Si mesa with a PN junction under a SiN waveguide. Input light in the SiN waveguide evanescently coupled into the Si mesa. The routing SiN waveguides were designed to have a thickness of  $150\\\\mathrm{nm}$  and a width of  $500\\\\mathrm{nm}$ . Adiabatically tapered edge couplers were used to facilitate\\n\\nfiber-to-chip coupling. The SiN width reduced from  $5.2\\\\mu \\\\mathrm{m}$  at the facet to  $500\\\\mathrm{nm}$ , the nominal width of the waveguide  $(W_{\\\\mathrm{gw}})$  in the chip. Figure 1b and d show the top-view optical micrograph and schematic of the SPAD. The waveguide width was narrowed to  $250\\\\pm 25\\\\mathrm{nm}$ $(W_{\\\\mathrm{gw}})$  along the length of the junction at the Si mesa facet to enhance the coupling efficiency between the SiN waveguide and the PN junction. The interlayer separation was about  $150\\\\mathrm{nm}$ .\",\n        \"section_type\": \"Proposed Architecture\",\n        \"reason\": \"This section details the proposed architecture and components. It describes the core structure (Si mesa with PN junction under a SiN waveguide), the physical principle of operation (evanescent coupling), and provides specific component specifications (waveguide dimensions, taper dimensions, interlayer separation).\"\n    },\n    {\n        \"text\": \"In the linear mode operation of the device, the number of generated charge carriers,  $n_{\\\\mathrm{e}}$ , is linearly proportional to the number of absorbed photons,  $n_{\\\\mathrm{p}}$  as given by\\n\\n$$\\n\\nn _ {\\\\mathrm {e}} \\\\propto \\\\eta \\\\cdot M \\\\cdot n _ {\\\\mathrm {p}}, \\\\tag {1}\\n\\n$$\\n\\nwhere  $\\\\eta$  and  $M$  are internal quantum efficiency and avalanche multiplication factor, respectively. The measured current-voltage  $(I - V)$  characteristics in Fig. 1f show the linear-mode operation of the device at  $\\\\lambda = 488\\\\mathrm{nm}$  and  $\\\\lambda = 532\\\\mathrm{nm}$  for transverse electric (TE) and transverse magnetic (TM) polarized input light. The results are consistent with the typical avalanche photodetector (APD) reported in ref. 34. A photocurrent,  $I_{\\\\mathrm{epk}}$ , of  $0.68~\\\\mu \\\\mathrm{A}$ $(0.76\\\\mu \\\\mathrm{A})$  was observed for a TE (TM)-polarized light with an optical power,  $P_{\\\\mathrm{no}}$  of  $2.13~\\\\mu \\\\mathrm{W}$ $(2.33~\\\\mu \\\\mathrm{W})$  at  $\\\\lambda = 488\\\\mathrm{nm}$  with a reverse bias of  $8\\\\mathrm{V}$ . Measurements were also repeated for  $\\\\lambda = 532\\\\mathrm{nm}$ . The\\n\\ncorresponding responsivity and external quantum efficiency (EQE) were  $0.32\\\\mathrm{A / W}$ $(0.17\\\\mathrm{A / W})$  and  $81\\%$ $(40\\%)$  for TE-polarized light at  $\\\\lambda = 488~\\\\mathrm{nm}$ $(\\\\lambda = 532\\\\mathrm{nm})$ , respectively. The linear mode performance of the device is summarized in Table 1. The measured photocurrent includes the absorption of stray light in the cladding, which was not coupled to the waveguide. Thus, the effective photocurrent  $(I_{\\\\mathrm{epk}})$ . Fig. 1f-inset due to the light coupled to the waveguide was measured by removing the contribution of the stray light (see the \\\"Methods\\\" section). The dark current, as depicted in Fig. 1e, was  $0.16\\\\mathrm{nA}$  at a reverse bias of  $2\\\\mathrm{V}$  and room temperature.\",\n        \"section_type\": \"Results\",\n        \"reason\": \"This paragraph describes the physical principles of linear mode operation (avalanche multiplication) and provides key performance metrics for the device operating as an APD, including responsivity, external quantum efficiency (EQE), and dark current.\"\n    },\n    {\n        \"text\": \"Table 1 | Summary of the APD performance in linear mode at room temperature\\n\\n|  λ (nm) | Polarization | Responsivity (A/W) | EQE (%)  |\\n| --- | --- | --- | --- |\\n|  488 | TE | 0.32 | 81  |\\n|  488 | TM | 0.33 | 83  |\\n|  532 | TE | 0.17 | 40  |\\n|  532 | TM | 0.25 | 59  |\",\n        \"section_type\": \"Results\",\n        \"reason\": \"This table provides a clear summary of component specifications and performance metrics (Responsivity, EQE) for the device in linear (APD) mode at different wavelengths and polarizations.\"\n    },\n    {\n        \"text\": \"At  $\\\\lambda = 488\\\\mathrm{nm}$  PDEs of  $4.2\\%$  and  $5.5\\%$  were observed with  $V_{\\\\mathrm{ex}}$  of  $13.3\\%$  ( $I_{\\\\mathrm{bias}} = 2\\\\mu \\\\mathrm{A}$ ) for TE and TM polarization, respectively. The SPAD under the same bias provided a PDE of  $\\\\sim 3.5\\%$  at  $532\\\\mathrm{nm}$ . As shown in Fig. 4, the PDE reached  $10\\%$  ( $6.3\\%$ ) at  $488\\\\mathrm{nm}$  ( $532\\\\mathrm{nm}$ ) with  $V_{\\\\mathrm{ex}}$  of  $19.5\\%$  and  $I_{\\\\mathrm{bias}} = 3\\\\mu \\\\mathrm{A}$ . The further increase in  $V_{\\\\mathrm{ex}}$  led to a higher PDE since the probability of avalanche,  $P_{a}$ , was higher[39]. However, this and the electric field-dependent carrier generation also increased the DCR[39]. As  $P_{a}$  approaches unity with an increase in  $V_{\\\\mathrm{ex}}$ , the PDE reaches its maximum; however, the high electric field still contributes to the growth of DCR. Consequently,  $V_{\\\\mathrm{ex}}$  is restricted by the signal-to-noise (SNR) ratio.\",\n        \"section_type\": \"Results\",\n        \"reason\": \"This paragraph details the primary performance metrics of the SPAD in Geiger mode, specifically the photon detection efficiency (PDE) at different wavelengths, polarizations, and excess bias voltages. It also touches on the physical principles governing the trade-off between PDE and DCR.\"\n    },\n    {\n        \"text\": \"Figure 4a shows the DCR as a function of the excess bias voltage of the SPAD at room temperature  $(21^{\\\\circ}\\\\mathrm{C})$ . The DCR was between 49 and  $107\\\\mathrm{kHz}$  with  $V_{\\\\mathrm{ex}}$  in the range of  $6.7 - 19.5\\%$ , and it increased with bias voltage, consistent with the trap-assisted-tunneling component of Shockley-Read-Hall model[40]. The impact of thermal generation on DCR was investigated by conducting measurements on a nominally identical device from another chip at lower temperatures. The  $I - V$  characteristics of the SPAD in linear-mode at 21, -5, and  $-9^{\\\\circ}\\\\mathrm{C}$  is shown in Fig. 4c. As the temperature decreased from 21 to  $-9^{\\\\circ}\\\\mathrm{C}$ , the dark current decreased from  $0.4\\\\mathrm{nA}$  to  $20\\\\mathrm{pA}$  at  $8\\\\mathrm{V}$  reverse bias, and  $V_{\\\\mathrm{bv}}$  shifted from 12.94 to  $12.6\\\\mathrm{V}$ . Similar to the linear-mode dark current, the DCR of the SPAD in Geiger-mode decreased with temperature due to the reduced thermal generation rate in the junction, as shown in Fig. 4d. For example, under high electric fields, i.e.,  $V_{\\\\mathrm{ex}} = 17\\%$ , the DCR at room temperature was about  $105\\\\mathrm{kHz}$  while it reduced by about  $35\\%$  to about 69 and  $68\\\\mathrm{kHz}$  at  $-5$  and  $-9^{\\\\circ}\\\\mathrm{C}$ , respectively.\",\n        \"section_type\": \"Results\",\n        \"reason\": \"This section provides key performance metrics, specifically the dark count rate (DCR) and its dependence on bias voltage and temperature. It also explains the physical principles behind these trends, such as trap-assisted tunneling and thermal generation.\"\n    },\n    {\n        \"text\": \"Table 2 | Summary of the SPAD performance in Geiger mode at room temperature\\n\\n|  Ibias(μA) | Vex(%) | PDE (%) |   |   |   | DCR (kHz)  |\\n| --- | --- | --- | --- | --- | --- | --- |\\n|   |   |  488 nm TE | 488 nm TM | 532 nm TE | 532 nm TM  |   |\\n|  1.5 | 10.8 | 3.1 | 3.8 | 1.8 | 2.7 | 60  |\\n|  2 | 13.3 | 4.2 | 5.5 | 3.5 | 3.3 | 83  |\\n|  3 | 19.5 | 7 | 10.2 | 5.2 | 6.3 | 107  |\",\n        \"section_type\": \"Results\",\n        \"reason\": \"This table summarizes the key performance metrics of the SPAD in Geiger mode, correlating the bias conditions (Ibias, Vex) with the resulting Photon Detection Efficiency (PDE) and Dark Count Rate (DCR).\"\n    },\n    {\n        \"text\": \"Unlike conventional CMOS SPADs for free-space optical input[23,24,27], our structure employs a lateral junction in a Si mesa. This configuration enables efficient evanescent light coupling from the SiN waveguide. The presence of a thin lateral junction in our SPAD design, while advantageous for integration with various photonic components on our platform, impacts the PDE and can introduce errors in photon detection due to a fraction of excited carriers drifting into the Si substrate.\",\n        \"section_type\": \"Discussion\",\n        \"reason\": \"This paragraph highlights the novel architectural aspect of the device (lateral junction in a Si mesa) and explains its design function (enabling evanescent coupling from a waveguide), contrasting it with conventional designs.\"\n    },\n    {\n        \"text\": \"An important performance metric is the timing jitter, which is the variance in the histogram representing the time delay between the electrical response of the detector and the arrival time of the incoming photon. In our measurements, the full-width at half-maximum (FWHM) of the histogram of the relative arrival times of the photon counts was  $\\\\sim 400$  ns. The fluctuation can be attributed to the laser source, measurement equipment (i.e., DSO), electrical circuitry (i.e., passive quenching circuit), and the SPAD junction. The most significant contributor to the timing performance was the rise/fall time of the quenching circuit, which also set the dead-time of photon detection. Here, the fall time of the avalanche pulses was about  $270~\\\\mathrm{ns}$ , mainly due to junction capacitance  $C_{\\\\mathrm{j}}$  and load resistance  $R_{\\\\mathrm{L}}$ .\",\n        \"section_type\": \"Discussion\",\n        \"reason\": \"This section introduces and quantifies a key performance me\n\n[TRUNCATED]", "reasoning": "The evidence explicitly states that the 'light emitters, optimized for blue or amber light'. 'Blue' and 'amber' directly refer to specific ranges of optical wavelengths. This establishes a direct relationship where the architecture is designed to operate at certain wavelengths. A new edge type 'OPERATES_AT_WAVELENGTH' is proposed to capture this specific and common relationship in photonics.", "source_document": "08_Sh
