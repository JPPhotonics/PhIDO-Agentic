let idx = 0;
let enterTs = 0;
const startedAt = new Date().toISOString();

// restore any in-progress session
try { const s = JSON.parse(localStorage.getItem(KEY) || "{}"); responses = s.responses || {}; idx = s.idx || 0; } catch(e){}

function save(){ localStorage.setItem(KEY, JSON.stringify({responses, idx, startedAt})); }
function accrue(){ if(enterTs){ const it=items[idx]; if(it){ const r=responses[it.id]||(responses[it.id]={label:null,time_ms:0}); r.time_ms += Math.round(performance.now()-enterTs); } } }

function setLabel(label){
  accrue(); const it=items[idx];
  (responses[it.id]||(responses[it.id]={time_ms:0})).label = label;
  save();
  if(idx < items.length-1){ idx++; render(); } else { render(); }
}
function go(d){ accrue(); idx = Math.max(0, Math.min(items.length-1, idx+d)); save(); render(); }

function answeredCount(){ return Object.values(responses).filter(r=>r&&r.label).length; }

function render(){
  document.getElementById("who").textContent = "annotator: " + BUNDLE.annotator_id;
  const done = answeredCount();
  document.getElementById("counter").textContent = done + " / " + items.length;
  document.getElementById("barfill").style.width = (100*done/items.length) + "%";

  const main = document.getElementById("main");
  if(idx >= items.length){ idx = items.length-1; }
  const it = items[idx];
  const cur = responses[it.id] && responses[it.id].label;
  const quotes = (Array.isArray(it.evidence_quotes)?it.evidence_quotes:[it.evidence_quotes])
                   .filter(Boolean).map(q=>`<p class="quote">${escapeHtml(q)}</p>`).join("");

  main.innerHTML = `
    <div class="instr">${escapeHtml(BUNDLE.instructions||"")}</div>
    <div class="card">
      <div class="reltype">${escapeHtml(it.head_type||"")} → ${escapeHtml(it.relation)} → ${escapeHtml(it.tail_type||"")}</div>
      <div class="reldef">${escapeHtml((BUNDLE.relation_definitions||{})[it.relation]||"")}</div>
      <div class="stmt"><b>${escapeHtml(it.head)}</b> ${escapeHtml(phrase(it.relation))} <b>${escapeHtml(it.tail)}</b>.</div>
      <div class="entdefs">
        <div><span class="ent">${escapeHtml(it.head)}</span>${it.head_description?" — "+escapeHtml(it.head_description):' <span class="nodesc">(no description in KG)</span>'}</div>
        <div><span class="ent">${escapeHtml(it.tail)}</span>${it.tail_description?" — "+escapeHtml(it.tail_description):' <span class="nodesc">(no description in KG)</span>'}</div>
      </div>
      <div class="q">Is this relationship <b>correct</b>?</div>
      <div class="evlabel">Supporting evidence the system found (context — the relationship may be inferred):</div>
      <div class="quotes">${quotes || '<span style="color:var(--skip)">(no evidence provided)</span>'}</div>
      <div class="actions">
        <button class="b-sup ${cur==='supported'?'chosen':''}" onclick="setLabel('supported')">Correct &nbsp;<small>(f)</small></button>
        <button class="b-not ${cur==='not_supported'?'chosen':''}" onclick="setLabel('not_supported')">Incorrect &nbsp;<small>(j)</small></button>
        <button class="b-skip ${cur==='skip'?'chosen':''}" onclick="setLabel('skip')">Unsure &nbsp;<small>(s)</small></button>
      </div>
      <details class="reasoning" ontoggle="onReasoning('${it.id}', this)">
        <summary>Show the system's reasoning for this relationship (optional)</summary>
        <div class="rtext">${it.reasoning ? escapeHtml(it.reasoning) : '(no reasoning recorded)'}</div>
      </details>
      <div class="nav">
        <span><a onclick="go(-1)">‹ Prev</a></span>
        <span>item ${idx+1} of ${items.length}${cur?` · <span style="color:var(--accent)">${LABEL_DISPLAY[cur]||cur}</span>`:""}</span>
        <span><a onclick="go(1)">Next ›</a></span>
      </div>
      <div class="kbd">keys: <b>f</b> correct · <b>j</b> incorrect · <b>s</b> unsure · ←/→ navigate</div>
      <details class="glossary"><summary>What do the relationship types mean?</summary>
        ${Object.entries(BUNDLE.relation_definitions||{}).map(([k,v])=>`<div><b>${escapeHtml(k)}</b> — ${escapeHtml(v)}</div>`).join("")}
      </details>
    </div>
    ${done===items.length ? `<div class="done"><h2>All ${items.length} done — thank you!</h2>
        <p style="color:var(--muted)">Click below and email the file back. You can re-download anytime.</p>
        <button class="b-sup" onclick="downloadLabels()">Download labels</button></div>` : ""}
  `;
  enterTs = performance.now();
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Record (once) that the annotator opened the system-reasoning panel for an item, and whether
// they had already answered. Lets the analysis report agreement on the UN-VIEWED subset (clean,
// un-anchored) separately from items where the reasoning was consulted.
function onReasoning(id, el){
  if(!el || !el.open) return;
  const r = responses[id] || (responses[id] = {time_ms:0});
  if(!r.reasoning_viewed){ r.reasoning_viewed = true; r.viewed_with_prior_label = !!r.label; save(); }
}

function downloadLabels(){
  accrue();
  const out = {
    annotator_id: BUNDLE.annotator_id, schema_version: BUNDLE.schema_version||1,
    task: BUNDLE.task || "relationship_validity",
    started_at: startedAt, submitted_at: new Date().toISOString(),
    labels: items.map((it,i)=>({
      id: it.id, source_document: it.source_document, shown_order: it.shown_order??i,
      label: (responses[it.id]&&responses[it.id].label) || null,
      time_ms: (responses[it.id]&&responses[it.id].time_ms) || 0,
      reasoning_viewed: !!(responses[it.id]&&responses[it.id].reasoning_viewed),
      reasoning_viewed_with_prior_label: !!(responses[it.id]&&responses[it.id].viewed_with_prior_label)
    }))
  };
  const blob = new Blob([JSON.stringify(out,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "labels_" + BUNDLE.annotator_id + ".json";
  document.body.appendChild(a); a.click(); a.remove();
}

document.addEventListener("keydown", e=>{
  if(e.key==="f") setLabel("supported");
  else if(e.key==="j") setLabel("not_supported");
  else if(e.key==="s") setLabel("skip");
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="ArrowRight") go(1);
});

render();
</script>
</body>
</html>
