const BUNDLE = /*__BUNDLE_START__*/{"annotator_id": "xue", "schema_version": 2, "task": "relationship_validity", "instructions": "For each relationship the system extracted from your paper, decide whether it is CORRECT, using your expertise with this work — you generally won't need to re-read the paper. The entity descriptions and any supporting evidence are shown for context. Many relationships were INFERRED by the system rather than stated in a single sentence, so judge correctness, not whether one sentence states it. Use 'Unsure' if you can't judge from what's shown; no penalty.", "relation_definitions": {"BASED_ON_PRINCIPLE": "Links a Component, Architecture, or PDK_Cell to a Physical_Principle it is based on", "HAS_PROPERTY": "Links a Component, Architecture, or PDK_Cell to a Property it possesses", "PERFORMS_FUNCTION": "Links a Component, Architecture, or PDK_Cell to a Design_Function it performs", "RELATED_TO": "Generic relationship between any two entities (use sparingly)", "USES_COMPONENT": "Links an Architecture to a Component it uses"}, "items": [{"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:494", "head": "implantable silicon-based probe", "head_type": "Architecture", "head_description": "An implantable, silicon-based device designed to switch and route multiple optical beams for stimulating specific sets of neurons, while simultaneously recording the resulting neural activity. The probe incorporates a nanoscale switching network composed of reconfigurable silicon nitride waveguide structures and co-fabricated electrical recording sites. The technology is scalable and allows for advanced functions like beam focusing, steering, and structured illumination. An eight-beam version was demonstrated to stimulate small groups of neurons in mice with sub-millisecond precision.", "relation": "PERFORMS_FUNCTION", "tail": "electrophysiology recording", "tail_type": "Design_Function", "tail_description": "A key function of the implantable silicon neural probes, enabled by the dense integration of electronic circuits on the silicon platform. This capability allows the probes to record the electrical activity of neurons at the same time as performing optogenetic stimulation.", "reasoning": "The evidence quote for 'electrophysiology recording' explicitly states that \"Implantable silicon (Si) neural probes... enable concurrent electrophysiology recording\". The candidate entity, 'implantable silicon-based probe', is the architecture that enables/performs this function. The description of the probe also confirms it is designed for \"simultaneously recording the resulting neural activity.\" This is a clear case of an Architecture performing a Design_Function.", "source_document": "12_Xue_grating_emitter_neuralprobe_arXiv2401.04525", "shown_order": 0, "evidence_quotes": ["Implantable silicon (Si) neural probes leverage the dense integration of photonic and electronic circuits on Si to enable concurrent electrophysiology recording and optogenetic stimulation while maintaining a volume comparable to or smaller than that of other implantable approaches [6, 13, 7, 10, 14, 8, 15]."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:490", "head": "out-of-plane focusing grating emitters", "head_type": "Component", "head_description": "A specifically designed type of grating emitter that focuses light to a point located above the surface of the neural probe. This capability allows for spatially precise targeting of neurons at a distance. A significant advantage of this design is its ability to achieve the required intensities for optogenetic actuation (~1 mW/mm²) at lower input powers compared to other emitters.", "relation": "BASED_ON_PRINCIPLE", "tail": "Interference", "tail_type": "Physical_Principle", "tail_description": "Interference is a fundamental physical principle describing the combination of waves, where the resulting optical field profile is determined by the phases of the individual waves. This core phenomenon is exploited across silicon photonics design, forming the operating basis for several key components and architectures. Examples include: Mach–Zehnder Interferometers (MZI), where output intensity is a function of the phase difference (Δϕ) between arms; Multimode Interference (MMI) devices, where the optical field evolves through the interference of multiple propagating supermodes; and Bragg_Reflection in gratings, which relies on the constructive interference of distributed reflections for Wavelength_Filter functionality. In nanophotonic phased arrays (NPAs), interference between the emissions from multiple optical antennas is used to form a desired far-field radiation pattern. In certain phased array architectures, interference can occur primarily on-chip to form a guided beam, which is then subsequently radiated out-of-plane by a separate component like a slab grating. Furthermore, in programmable Photonic Integrated Circuits (PICs), interference within meshes of connected waveguides is controlled to implement various linear functions and programmable wavelength filters. When scaled, these interference-based meshes can perform complex linear optical computations, such as real-time matrix-vector products.", "reasoning": "A grating emitter is a periodic structure that scatters light. The scattered light waves interfere constructively in specific directions to form the output beam. A focusing grating is specifically designed so this interference pattern converges at a focal point. Therefore, the component's operation is fundamentally based on the principle of interference.", "source_document": "12_Xue_grating_emitter_neuralprobe_arXiv2401.04525", "shown_order": 1, "evidence_quotes": ["To transform the incident wave to the desired output beam, we used the holographic principle to determine the set of grating curves to shape the output phase profile.", "Specifically, the curves are the 2π-spaced contours of the phase map resultant from the sum of the phases of the input and desired output waves."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:477", "head": "focus the emitted light", "head_type": "Design_Function", "head_description": "The primary function of the nanophotonic and out-of-plane grating emitters integrated into the neural probes. The objective is to concentrate light at a specific point above the probe's surface, enabling spatially precise targeting of neurons. This focusing capability allows the system to achieve the required light intensities for optogenetic actuation (approximately 1 mW/mm²) with lower input powers compared to alternative emitter technologies.", "relation": "RELATED_TO", "tail": "optogenetic stimulation", "tail_type": "Design_Function", "tail_description": "A primary application of implantable neural probes, which deliver light of specific wavelengths to activate or inhibit genetically modified neurons. For targeted neural stimulation, patterned illumination is crucial. The delivered wavelength is tailored to match the excitation spectra of the light-sensitive proteins (opsins) expressed by the neurons. Due to optical scattering in brain tissue, light-emitting implants are necessary to deliver patterned light to deep brain regions. The probes deliver sufficient light intensities for this purpose, and the function can operate concurrently with electrophysiology recording or be used with fluorophores for imaging. It is a technique commonly applied in animal models, such as rodent brains.", "reasoning": "Novel type 'ENABLES': The text states that 'The focusing of light emission has the additional benefit of reaching the required intensities for optogenetic actuation'. This indicates that the function of focusing is a direct enabler for the higher-level function of stimulation. This causal link between two functions is not well-captured by existing edge types.", "source_document": "12_Xue_grating_emitter_neuralprobe_arXiv2401.04525", "shown_order": 2, "evidence_quotes": ["The focusing of light emission has the additional benefit of reaching the required intensities for optogenetic actuation of ∼ 1 mW/mm2 [2] at lower input powers compared to other emitters."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:486", "head": "nanophotonic phased array (nanoantenna phased array)", "head_type": "Architecture", "head_description": "A large-scale, two-dimensional array of optical nanoantennas integrated on a silicon chip, designed to generate and control far-field radiation patterns. The device consists of a power distribution network that uniformly excites all antenna elements. The paper demonstrates a passive 64x64 version with 4,096 elements within a 576 µm x 576 µm footprint, and an active 8x8 version capable of dynamic beam steering and shaping via phase tuning.", "relation": "PERFORMS_FUNCTION", "tail": "focus the emitted light", "tail_type": "Design_Function", "tail_description": "The primary function of the nanophotonic and out-of-plane grating emitters integrated into the neural probes. The objective is to concentrate light at a specific point above the probe's surface, enabling spatially precise targeting of neurons. This focusing capability allows the system to achieve the required light intensities for optogenetic actuation (approximately 1 mW/mm²) with lower input powers compared to alternative emitter technologies.", "reasoning": "A nanophotonic phased array is an architecture designed to 'generate and control far-field radiation patterns' and is capable of 'dynamic beam steering and shaping'. This is fundamentally a method of focusing and directing light to a specific point or in a specific pattern. Therefore, this architecture performs the function 'focus the emitted light'.", "source_document": "12_Xue_grating_emitter_neuralprobe_arXiv2401.04525", "shown_order": 3, "evidence_quotes": ["[No sentence in the source paper directly supports this; the relationship was inferred by the extraction system.]"]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:480", "head": "nan tings for wavelengths of 488 and 594 nm, targeting the arXiv:2401.04525v2 [physics.optics] 10 Jan 2024 excitation spectra of the optogenetic actuators Channelrhodopsin-2 and Chrimson, respectively."]}, {"id": "5:fe564c09-334e-4362-a136-e4fd9087c2f3:482", "head": "nanophotonic grating emitters", "head_type": "Component", "head_description": "Optical components integrated into implantable silicon neural probes, designed to focus emitted light for precise optogenetic targeting of neurons. The gratings are designed using the holographic principle for specific operational wavelengths, such as 488 nm and 594 nm, to match the excitation spectra of common optogenetic actuators. The measured optical emission pattern of these emitters has shown good agreement with simulations in both non-scattering media and tissue.", "relation": "HAS_PROPERTY", "tail": "Etch Depth", "tail_type": "Property", "tail_description": "Etch_Depth (ed) is a fundamental property defining the depth of silicon removed during the fabrication process to define periodic structures, such as those in a Grating_Coupler, or to create the slab region of a rib waveguide. The etch depth is determined by the fabrication process parameters. It is a critical parameter because it directly influences the grating coupler's performance by impacting the effective index of refraction (neff) of the grating region. As the etch depth increases, the effective index decreases, which results in a blueshift (shift to shorter wavelengths) in the grating coupler's central wavelength. For example, shallow etches of 60 nm to 70 nm are optimal for grating couplers, and an etch depth resulting in a 90 nm slab thickness (i.e., 130 nm etch for a 220 nm silicon layer) is common for rib waveguides. The sensitivity of the central wavelength (λ) to the etch depth is high, with a determined tuning coefficient of 1.9 nm/nm.", "reasoning": "The new entity is a 'nanophotonic grating emitter' which was 'fabricated'. A grating is a periodic struc const REL_PHRASE = {
  PERFORMS_FUNCTION:"performs the function of", BASED_ON_PRINCIPLE:"is based on the principle of",
  HAS_PROPERTY:"has the property", USES_COMPONENT:"uses the component", IMPLEMENTS:"implements",
  EXHIBITS:"exhibits", FABRICATED_WITH:"is fabricated with", COMPOSED_OF:"is composed of",
  RELATED_TO:"is related to"
};
function phrase(rel){ return REL_PHRASE[rel] || rel.toLowerCase().replace(/_/g," "); }
// Internal label values are kept (supported/not_supported/skip) for analysis compatibility;
// these are how they read to the annotator under the relationship-validity task.
const LABEL_DISPLAY = { supported:"correct", not_supported:"incorrect", skip:"unsure" };

const KEY = "phido_labels_" + BUNDLE.annotator_id;
const items = BUNDLE.items;
let responses = {};            // id -> {label, time_ms}
let idx = 0;
let enterTs = 0;
const startedAt = new Date().toISOString();

// restore any in-progress session
try { const s = JSON.parse(localStorage.getItem(KEY) || "{}"); responses = s.responses || {}; idx = s.idx || 0; } catch(e){}

function save(){ localStorage.setItem(KEY, JSON.stringify({responses, idx, startedAt})); }
function accrue(){ if(enterTs){ const it=items[idx]; if(it){ const r=responses[it.id]||(responses[it.id]={label:null,time_ms:0}); r.time_ms += Math.round(performance.now()-enterTs); } } }

function setLabel(label){
  accrue(); const it=items[idx];
  (responses[it.id]||(responses[it.id]={time_ms:0})).label = label;
  save();
  if(idx < items.length-1){ idx++; render(); } else { render(); }
}
function go(d){ accrue(); idx = Math.max(0, Math.min(items.length-1, idx+d)); save(); render(); }

function answeredCount(){ return Object.values(responses).filter(r=>r&&r.label).length; }

function render(){
  document.getElementById("who").textContent = "annotator: " + BUNDLE.annotator_id;
  const done = answeredCount();
  document.getElementById("counter").textContent = done + " / " + items.length;
  document.getElementById("barfill").style.width = (100*done/items.length) + "%";

  const main = document.getElementById("main");
  if(idx >= items.length){ idx = items.length-1; }
  const it = items[idx];
  const cur = responses[it.id] && responses[it.id].label;
  const quotes = (Array.isArray(it.evidence_quotes)?it.evidence_quotes:[it.evidence_quotes])
                   .filter(Boolean).map(q=>`<p class="quote">${escapeHtml(q)}</p>`).join("");

  main.innerHTML = `
    <div class="instr">${escapeHtml(BUNDLE.instructions||"")}</div>
    <div class="card">
      <div class="reltype">${escapeHtml(it.head_type||"")} → ${escapeHtml(it.relation)} → ${escapeHtml(it.tail_type||"")}</div>
      <div class="reldef">${escapeHtml((BUNDLE.relation_definitions||{})[it.relation]||"")}</div>
      <div class="stmt"><b>${escapeHtml(it.head)}</b> ${escapeHtml(phrase(it.relation))} <b>${escapeHtml(it.tail)}</b>.</div>
      <div class="entdefs">
        <div><span class="ent">${escapeHtml(it.head)}</span>${it.head_description?" — "+escapeHtml(it.head_description):' <span class="nodesc">(no description in KG)</span>'}</div>
        <div><span class="ent">${escapeHtml(it.tail)}</span>${it.tail_description?" — "+escapeHtml(it.tail_description):' <span class="nodesc">(no description in KG)</span>'}</div>
      </div>
      <div class="q">Is this relationship <b>correct</b>?</div>
      <div class="evlabel">Supporting evidence the system found (context — the relationship may be inferred):</div>
      <div class="quotes">${quotes || '<span style="color:var(--skip)">(no evidence provided)</span>'}</div>
      <div class="actions">
        <button class="b-sup ${cur==='supported'?'chosen':''}" onclick="setLabel('supported')">Correct &nbsp;<small>(f)</small></button>
        <button class="b-not ${cur==='not_supported'?'chosen':''}" onclick="setLabel('not_supported')">Incorrect &nbsp;<small>(j)</small></button>
        <button class="b-skip ${cur==='skip'?'chosen':''}" onclick="setLabel('skip')">Unsure &nbsp;<small>(s)</small></button>
      </div>
      <details class="reasoning" ontoggle="onReasoning('${it.id}', this)">
        <summary>Show the system's reasoning for this relationship (optional)</summary>
        <div class="rtext">${it.reasoning ? escapeHtml(it.reasoning) : '(no reasoning recorded)'}</div>
      </details>
      <div class="nav">
        <span><a onclick="go(-1)">‹ Prev</a></span>
        <span>item ${idx+1} of ${items.length}${cur?` · <span style="color:var(--accent)">${LABEL_DISPLAY[cur]||cur}</span>`:""}</span>
        <span><a onclick="go(1)">Next ›</a></span>
      </div>
      <div class="kbd">keys: <b>f</b> correct · <b>j</b> incorrect · <b>s</b> unsure · ←/→ navigate</div>
      <details class="glossary"><summary>What do the relationship types mean?</summary>
        ${Object.entries(BUNDLE.relation_definitions||{}).map(([k,v])=>`<div><b>${escapeHtml(k)}</b> — ${escapeHtml(v)}</div>`).join("")}
      </details>
    </div>
    ${done===items.length ? `<div class="done"><h2>All ${items.length} done — thank you!</h2>
        <p style="color:var(--muted)">Click below and email the file back. You can re-download anytime.</p>
        <button class="b-sup" onclick="downloadLabels()">Download labels</button></div>` : ""}
  `;
  enterTs = performance.now();
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Record (once) that the annotator opened the system-reasoning panel for an item, and whether
// they had already answered. Lets the analysis report agreement on the UN-VIEWED subset (clean,
// un-anchored) separately from items where the reasoning was consulted.
function onReasoning(id, el){
  if(!el || !el.open) return;
  const r = responses[id] || (responses[id] = {time_ms:0});
  if(!r.reasoning_viewed){ r.reasoning_viewed = true; r.viewed_with_prior_label = !!r.label; save(); }
}

function downloadLabels(){
  accrue();
  const out = {
    annotator_id: BUNDLE.annotator_id, schema_version: BUNDLE.schema_version||1,
    task: BUNDLE.task || "relationship_validity",
    started_at: startedAt, submitted_at: new Date().toISOString(),
    labels: items.map((it,i)=>({
      id: it.id, source_document: it.source_document, shown_order: it.shown_order??i,
      label: (responses[it.id]&&responses[it.id].label) || null,
      time_ms: (responses[it.id]&&responses[it.id].time_ms) || 0,
      reasoning_viewed: !!(responses[it.id]&&responses[it.id].reasoning_viewed),
      reasoning_viewed_with_prior_label: !!(responses[it.id]&&responses[it.id].viewed_with_prior_label)
    }))
  };
  const blob = new Blob([JSON.stringify(out,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "labels_" + BUNDLE.annotator_id + ".json";
  document.body.appendChild(a); a.click(); a.remove();
}

document.addEventListener("keydown", e=>{
  if(e.key==="f") setLabel("supported");
  else if(e.key==="j") setLabel("not_supported");
  else if(e.key==="s") setLabel("skip");
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="ArrowRight") go(1);
});

render();
</script>
</body>
